name: GA Gate09 R20 Bounded Integrated Sweep
on:
  pull_request:
    paths:
      - 'experiments/gate09/r20/**'
      - '.github/workflows/ga-gate09-r20-bounded.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r20-bounded:
    name: R20 Python solver / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source provenance and contracts
        run: python -m unittest discover -s experiments/gate09/r20/tests -p 'test_*.py' -v
      - name: Exercise bounded integrated solver and record gap trajectories
        run: python experiments/gate09/r20/ci/run_r20.py --profile ci --output '${{ runner.temp }}'
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r20-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R20-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
