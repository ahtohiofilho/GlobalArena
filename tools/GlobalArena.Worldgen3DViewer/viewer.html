<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Arena | Strategic Globe D.3</title><style>
:root{color-scheme:dark}body{margin:0;background:#08101f;color:#e2eaf8;font-family:system-ui,Segoe UI,sans-serif}header{padding:12px 20px;background:#111c30;display:flex;align-items:center;gap:18px;flex-wrap:wrap}header b{font-size:18px}button,input{font:inherit}button{background:#294b77;color:white;border:1px solid #4779b1;border-radius:6px;padding:8px;cursor:pointer}main{display:flex;flex-wrap:wrap}canvas{display:block;touch-action:none;flex:1;min-width:320px;height:calc(100vh - 75px);background:radial-gradient(circle at center,#132845,#060e1c 72%)}aside{width:245px;padding:20px;background:#0e192a}aside h2{font-size:17px}.muted{color:#9bb0cb;font-size:13px}dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}dt{color:#9bb0cb}dd{margin:0;text-align:right}#tip{margin-top:25px;font-size:13px;color:#b3c5df}input{max-width:230px}
</style></head><body><header><b>GLOBAL ARENA · D.3</b><label>Carregar snapshot JSON <input type="file" id="file" accept=".json,application/json"></label><button id="reset">Centralizar</button><span id="status" class="muted">Selecione o JSON exportado pelo QA</span></header><main><canvas id="view"></canvas><aside><h2>Inspeção estratégica</h2><dl id="metrics"></dl><h2>Célula selecionada</h2><div id="selection" class="muted">Clique em uma célula</div><p id="tip">Arraste para girar · roda do mouse para zoom · clique para identificar. Células pentagonais destacadas. Biomas do worldgen determinístico.</p></aside></main><script>
'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let data=null,yaw=.3,pitch=-.2,zoom=1,selected=0,polygons=[],drag=null;const colors={Water:'#2879b7',PolarIce:'#d6eaf4',Tundra:'#8ba2a8',Highland:'#7c7181',Wetland:'#4b8b74',Desert:'#d4b875',Rainforest:'#246a43',Forest:'#458658',Grassland:'#a2aa63'};
function rotatePoint(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*cy+p[2]*sy,z=-p[0]*sy+p[2]*cy;return [x,p[1]*cp-z*sp,p[1]*sp+z*cp]}
function horizonIntersection(a,b){let lo=0,hi=1;const positive=a[2]>=0;for(let k=0;k<45;k++){const t=(lo+hi)/2;let v=[a[0]*(1-t)+b[0]*t,a[1]*(1-t)+b[1]*t,a[2]*(1-t)+b[2]*t];const norm=Math.hypot(...v);if(norm===0)throw Error('Aresta antipodal inválida');v=v.map(n=>n/norm);if((v[2]>=0)===positive)lo=t;else hi=t}const t=(lo+hi)/2;const v=[a[0]*(1-t)+b[0]*t,a[1]*(1-t)+b[1]*t,a[2]*(1-t)+b[2]*t];const norm=Math.hypot(...v);return [v[0]/norm,v[1]/norm,0]}
function clipHorizon(points){const output=[];for(let i=0;i<points.length;i++){const a=points[(i+points.length-1)%points.length],b=points[i],av=a[2]>=0,bv=b[2]>=0;if(av!==bv)output.push(horizonIntersection(a,b));if(bv)output.push(b)}return output}
function paint(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);polygons=[];if(!data)return;const radius=Math.min(w,h)*.43*zoom;const verts=new Map(data.vertices.map(v=>[v.id,rotatePoint(v.position)]));const draw=[];for(const c of data.cells){const center=rotatePoint(c.center),all=c.boundary.map(id=>verts.get(id)),pts=clipHorizon(all);if(pts.length<3)continue;draw.push({c,center,pts})}draw.sort((a,b)=>a.center[2]-b.center[2]);for(const x of draw){const pts=x.pts.map(p=>[w/2+p[0]*radius,h/2-p[1]*radius]);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=colors[x.c.biome];ctx.fill();ctx.strokeStyle=x.c.id===selected?'#fff6a5':x.c.sides===5?'#ffb449':'#10283c';ctx.lineWidth=x.c.id===selected?3:x.c.sides===5?1.6:.65;ctx.stroke();polygons.push({id:x.c.id,pts})}}
function inside(p,poly){let yes=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if((a[1]>p[1])!=(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])yes=!yes}return yes}
function validPoint(p){return Array.isArray(p)&&p.length===3&&p.every(v=>typeof v==='number'&&Number.isFinite(v)&&Math.abs(v)<=1.000000000001)&&Math.abs(p.reduce((a,b)=>a+b*b,0)-1)<1e-9}
function integer(v,min,max){return Number.isSafeInteger(v)&&v>=min&&v<=max}
function validateSnapshot(j){if(!j||typeof j!=='object'||Array.isArray(j)||j.contract!=='GA-M4.5-D.3-strategic-sphere-v1')throw Error('Contrato incompatível');if(!integer(j.m,0,15)||!integer(j.n,0,15)||j.m+j.n<1||j.m+j.n>15)throw Error('Parâmetros Goldberg inválidos');if(!integer(j.seed,0,Number.MAX_SAFE_INTEGER))throw Error('Seed fora da faixa segura do visualizador');const T=j.m*j.m+j.m*j.n+j.n*j.n,expectedCells=10*T+2,expectedVertices=20*T;if(!integer(j.cellCount,12,2252)||!integer(j.vertexCount,20,4500)||j.cellCount!==expectedCells||j.vertexCount!==expectedVertices||!Array.isArray(j.cells)||!Array.isArray(j.vertices)||j.cells.length!==expectedCells||j.vertices.length!==expectedVertices)throw Error('Contagem topológica incompatível');const ids=new Set();for(let i=0;i<j.vertices.length;i++){const v=j.vertices[i];if(!v||!integer(v.id,1,expectedVertices)||v.id!==i+1||!validPoint(v.position))throw Error('Vértice inválido em '+i);ids.add(v.id)}let pent=0;const biomes=new Set(Object.keys(colors));for(let i=0;i<j.cells.length;i++){const c=j.cells[i];if(!c||!integer(c.id,1,expectedCells)||c.id!==i+1||!validPoint(c.center)||!integer(c.sides,5,6)||!Array.isArray(c.boundary)||c.boundary.length!==c.sides||new Set(c.boundary).size!==c.sides||!c.boundary.every(id=>integer(id,1,expectedVertices)&&ids.has(id))||typeof c.biome!=='string'||!biomes.has(c.biome))throw Error('Célula inválida em '+i);if(c.sides===5)pent++}if(pent!==12||j.cells.length-pent!==10*(T-1))throw Error('Distribuição pentagonal inválida');
const edges=new Map(),degree=new Uint8Array(expectedVertices+1),vertexCells=new Uint8Array(expectedVertices+1);
for(const c of j.cells){const b=c.boundary;for(let k=0;k<b.length;k++){const a=b[k],v=b[(k+1)%b.length],key=Math.min(a,v)+':'+Math.max(a,v),direction=a<v?1:-1,previous=edges.get(key);if(previous){if(previous.count!==1||previous.direction===direction)throw Error('Aresta sem incidência oposta: '+key);previous.count=2}else{edges.set(key,{count:1,direction})}vertexCells[a]++;}}
if(edges.size!==30*T)throw Error('Contagem de arestas incompatível');for(const e of edges.values()){if(e.count!==2)throw Error('Aresta sem duas células incidentes')}for(let i=1;i<=expectedVertices;i++){if(vertexCells[i]!==3)throw Error('Incidência de vértice inválida: '+i)}
// Canonical outward CCW winding, independent of global topological edge-pair checks.
for(const c of j.cells){let outward=0;for(let k=0;k<c.boundary.length;k++){const a=j.vertices[c.boundary[k]-1].position,b=j.vertices[c.boundary[(k+1)%c.boundary.length]-1].position;const cross=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];outward+=cross[0]*c.center[0]+cross[1]*c.center[1]+cross[2]*c.center[2]}if(!Number.isFinite(outward)||outward<=1e-10)throw Error('Orientação canônica CCW inválida: '+c.id)}return j}
function metric(name,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=String(value);return [dt,dd]}
function load(json){const verified=validateSnapshot(json);data=verified;selected=0;document.getElementById('status').textContent=`G(${verified.m},${verified.n}) · seed ${verified.seed}`;const el=document.getElementById('metrics');el.replaceChildren(...metric('Células',verified.cellCount),...metric('Vértices',verified.vertexCount),...metric('Pentágonos',12),...metric('Hexágonos',verified.cellCount-12));document.getElementById('selection').textContent='Clique em uma célula';paint()}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:false}};canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;yaw+=dx*.007;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.007));drag.x=e.clientX;drag.y=e.clientY;paint()};canvas.onpointerup=e=>{if(!drag)return;const moved=drag.moved;drag=null;if(moved||!data)return;const r=canvas.getBoundingClientRect(),p=[e.clientX-r.left,e.clientY-r.top];for(let i=polygons.length-1;i>=0;i--){if(inside(p,polygons[i].pts)){selected=polygons[i].id;const c=data.cells.find(x=>x.id===selected);document.getElementById('selection').textContent=`ID ${c.id} · ${c.sides===5?'Pentágono':'Hexágono'} · ${c.biome} · Centro: ${c.center.map(n=>n.toFixed(4)).join(', ')}`;paint();break}}};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.45,Math.min(2.8,zoom*(e.deltaY>0?.9:1.1)));paint()};document.getElementById('reset').onclick=()=>{yaw=.3;pitch=-.2;zoom=1;paint()};document.getElementById('file').onchange=async e=>{try{const file=e.target.files&&e.target.files[0];if(!file)throw Error('Nenhum arquivo selecionado');if(file.size>20000000)throw Error('Snapshot excede 20 MB');load(JSON.parse(await file.text()))}catch(err){data=null;selected=0;polygons=[];document.getElementById('metrics').replaceChildren();document.getElementById('selection').textContent='Nenhuma célula selecionada';document.getElementById('status').textContent='ERRO: '+err.message;paint()}};window.onresize=paint;paint();
</script></body></html>
