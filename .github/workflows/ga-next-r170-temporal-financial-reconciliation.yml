name: GA-Next R170 Temporal Financial Reconciliation

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalEconomicAccountingProposal.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationTemporalFinancialReconciler.cs'
      - 'GlobalArena.Tests/FoundationTemporalFinancialReconciliationTests.cs'
      - '.github/workflows/ga-next-r170-temporal-financial-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-finances:
    name: R170 journal worker-time exact revenues taxes and tolls / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build financial reconciliation on canonical market
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Validate R170 financial conservation and historical accounting
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationTemporalFinancialReconciliationTests|FullyQualifiedName~FoundationPhysicalEconomicAccountingProposalTests|FullyQualifiedName~FoundationTemporalNativeMarketTests|FullyQualifiedName~FoundationTemporalEconomicTurnTests|FullyQualifiedName~FoundationPersistedEdgeTravelTests' --logger 'console;verbosity=detailed'
