name: GA Gate09 ADR042 Independent Static F072 Certificate

on:
  pull_request:
    paths:
      - 'experiments/gate09/static_certificate_v1/**'
      - 'docs/ga-gate09-adr042-static-certificate-baseline-draft.md'
      - '.github/workflows/ga-gate09-adr042-static-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    name: ADR042 frozen equilibrium verifier / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all analytical and R20-R34 frozen static contract tests
        run: python -m unittest discover -s experiments/gate09/static_certificate_v1/tests -p 'test_*.py' -v
      - name: Verify no fabricated Q and classify 8 analytical snapshots
        run: python experiments/gate09/static_certificate_v1/ci/verify_complementarity.py --output '${{ runner.temp }}'
      - name: Archive read-only complementarity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr042-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR042-evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
