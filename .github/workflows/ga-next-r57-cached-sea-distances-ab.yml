name: GA-Next R57 — bounded sea distance reuse A/B

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalMultimodalRouteComparator.cs'
      - 'GlobalArena.Tests/FoundationPhysicalMultimodalRouteComparatorTests.cs'
      - '.github/workflows/ga-next-r57-cached-sea-distances-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-sea-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify unchanged optimum and bounded cross-snapshot reuse
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationPhysicalMultimodalRouteComparatorTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r57-evidence.log
          grep 'GA_R57_CACHE' ga-next-r57-evidence.log > ga-next-r57-amortized-work-report.txt
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-r57-bounded-distance-cache-evidence
          path: |
            ga-next-r57-evidence.log
            ga-next-r57-amortized-work-report.txt
          retention-days: 14
