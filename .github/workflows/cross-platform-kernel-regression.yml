name: Cross-Platform Kernel Regression Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cross-platform-kernel-regression.yml"
      - "GlobalArena.Kernel/**"
      - "GlobalArena.World/**"
      - "GlobalArena.Runtime/**"
      - "GlobalArena.Simulation/**"
      - "GlobalArena.Tests/**"
      - "Directory.Build.props"
      - "GlobalArena.slnx"
  # Ordinary PRs use FAST. Full lanes are checkpoint-only.
  # Add ga-ci-checkpoint for cross-platform review, ga-ci-full before merge.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # A skipped checkpoint is NOT evidence of a successful full regression.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ga-ci-checkpoint') ||
      contains(github.event.pull_request.labels.*.name, 'ga-ci-full')
    name: Validate kernel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS Intel regression exceeded 25 minutes after successful restore/build;
    # preserve 25 minutes for Linux/Windows, allow up to 60 on Intel macOS.
    # A timeout does NOT count as successful testing; evidence remains required.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 60 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          # Temporary Intel x64 contingency: macos-15 arm64 runners were
          # unavailable due to hosted-runner capacity (runner_id=0).
          # macOS ARM64 coverage remains pending and must be restored later.
          - macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Capture platform
        run: dotnet --info > platform.txt

      - name: Restore
        run: dotnet restore GlobalArena.slnx

      - name: Build
        run: dotnet build GlobalArena.slnx --configuration Release --no-restore

      - name: Run full kernel regression suite
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=kernel-regression.trx" --results-directory artifacts

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-regression-${{ matrix.os }}
          path: |
            platform.txt
            artifacts/kernel-regression.trx
          if-no-files-found: error
