name: GA Gate09 R31 Market Crossing Decomposition

on:
  pull_request:
    paths:
      - 'experiments/gate09/r31/**'
      - 'docs/ga-gate09-r31-market-crossing-decomposition-draft.md'
      - '.github/workflows/ga-gate09-r31-crossings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossing-diagnostics:
    name: R31 price-quantity and route decomposition / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source integrity, algebraic identities and frozen replay
        run: python -m unittest discover -s experiments/gate09/r31/tests -p 'test_*.py' -v
      - name: Compare price and transport components across frozen F072 trajectories
        run: python experiments/gate09/r31/ci/run_r31.py --profile ci --output '${{ runner.temp }}'
      - name: Publish per-market crossing and fractional-step evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r31-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R31-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
