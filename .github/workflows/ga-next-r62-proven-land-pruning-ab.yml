name: GA-Next R62 — exact terrestrial-bound routing A/B

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalMultimodalRouteComparator.cs'
      - 'GlobalArena.Tests/FoundationPhysicalMultimodalRoiBenchmarkTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalMultimodalRouteComparatorTests.cs'
      - '.github/workflows/ga-next-r62-proven-land-pruning-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-routing-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify proof-safe land bound vs original maritime oracle
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationPhysicalMultimodalRoiBenchmarkTests|FullyQualifiedName~FoundationPhysicalMultimodalRouteComparatorTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r62-evidence.log
          grep 'GA_R62_' ga-next-r62-evidence.log > ga-next-r62-routing-ab.txt
      - name: Archive route equality and measured ROI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-next-r62-proof-safe-pair-pruning
          path: |
            ga-next-r62-evidence.log
            ga-next-r62-routing-ab.txt
          retention-days: 14
