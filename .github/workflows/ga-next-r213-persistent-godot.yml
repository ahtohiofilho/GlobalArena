name: GA-Next R213 Persistent Godot UI
on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/**'
      - 'GlobalArena.Runtime/**'
      - 'GlobalArena.Simulation/**'
      - 'docs/fixtures/GA-NEXT-R232A-UNIFORM-CITY-50-HASHES.txt'
      - 'docs/fixtures/GA-NEXT-R232D-DISPERSED-100-HASHES.txt'
      - 'tools/qa/compare_r232e_profiles.py'
      - 'GlobalArena.Simulation/Foundation/FoundationTacticalHumanAiTurnHost.cs'
      - '.github/workflows/ga-next-r213-persistent-godot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistent-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile client
        run: dotnet build tools/GlobalArena.Godot -c Debug -p:Optimize=false
      - name: Install Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.7.2-stable_mono_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import project
        run: timeout 180 "$GODOT_BIN" --headless --editor --path tools/GlobalArena.Godot --import
      - name: Exercise actual controls
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R213_PERSISTENT_UI_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R216_WORKER_CONTEXT_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R218_SITE_HUD_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R2211_HUD_POINTER_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R2212_CONTEXTUAL_DOCK_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R225_COMPACT_DOCK_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R226_MAP_ORDERS_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R227_MAP_CONNECTION_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R2213_AUXILIARY_PLANET_PASS' "$RUNNER_TEMP/r213.log"
          grep -q 'GA_NEXT_R220_CONNECTION_DIAGRAM_PASS' "$RUNNER_TEMP/r213.log"
      - name: Exercise crop preview
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_OPERATIONAL_PREVIEW: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/crops.log"
          grep -q 'GA_NEXT_R219A1_CROP_PREVIEW_PASS' "$RUNNER_TEMP/crops.log"
          grep -q 'GA_NEXT_R219A3_FOOD_READOUT_PASS' "$RUNNER_TEMP/crops.log"
          grep -q 'GA_NEXT_R219B_OPERATIONAL_UI_PASS' "$RUNNER_TEMP/crops.log"
          grep -q 'GA_NEXT_R224_WORKER_WINDOW_PASS' "$RUNNER_TEMP/crops.log"
      - name: Exercise experimental local economy
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R22813C_LOCAL_ECONOMY_READY' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R22813C_LOCAL_ECONOMY_UI_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2292_CITY_PRODUCTION_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2293_CITY_WORKERS_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2294_CONNECTION_TRADE_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2301_NUMERIC_FORMAT_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2302_LAYERED_WORLD_DOCK_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2303_UNIT_CARD_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2304_INFRASTRUCTURE_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2305_TERRAIN_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2306_PLANET_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23061A_WIDGET_SHELL_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23061B_UNIT_WIDGET_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23061C_INFRA_WIDGET_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23061D_TERRAIN_WIDGET_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23061E_PLANET_WIDGET_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23062_OPERATIONAL_CARD_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23063_MAP_SELECTION_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R23064_MONO_HUD_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_VISUAL01_MATERIAL_PASS' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_VISUAL02C_DEPTH_PASS raised_key=true recessed_lip=true footer_depth=true cached=true' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_VISUAL02D_TYPE_PASS identities=3 sections=3 planet=true metric=true feedback=true' "$RUNNER_TEMP/local-economy.log"
          grep -q 'GA_NEXT_R2311_CARTOGRAPHIC_PASS' "$RUNNER_TEMP/local-economy.log"
          for cycle in 1 2 3; do
            grep -E "GA_NEXT_R22921_CITY_PRIVACY_PASS own=[0-9]+ foreign=[0-9]+ cycle=$cycle$" "$RUNNER_TEMP/local-economy.log"
          done
      - name: Require positive remote and zero-edge local eight-commodity trade
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          for mode in remote local; do
            GA_NEXT_R2313_TRADE_FIXTURE="$mode" timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/trade-$mode.log"
            grep -q "GA_NEXT_R2313_TRADE_FIXTURE_PASS mode=$mode cycles=2" "$RUNNER_TEMP/trade-$mode.log"
            if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/trade-$mode.log"; then exit 1; fi
          done
      - name: Exercise demographic growth in the normal local economy opening
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/demographic.log"
          grep -q 'GA_NEXT_R2315_DEMOGRAPHIC_PASS cycles=3' "$RUNNER_TEMP/demographic.log"
          grep -q 'GA_NEXT_R2316_NORMAL_TRADE_AUDIT_PASS cycles=9' "$RUNNER_TEMP/demographic.log"
          if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|GA_NEXT_FINE_HUMAN_AI_REJECTED|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/demographic.log"; then exit 1; fi
      - name: Exercise bounded trade in the same demographic opening
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_BOUNDED_TRADE_PREVIEW: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/bounded-trade.log"
          grep -q 'GA_NEXT_R2315_DEMOGRAPHIC_PASS cycles=3' "$RUNNER_TEMP/bounded-trade.log"
          grep -q 'GA_NEXT_R2317_BOUNDED_TRADE_PASS cycles=9' "$RUNNER_TEMP/bounded-trade.log"
          grep -E 'GA_NEXT_R2318C_CROP_ROWS_PASS actual_rows=[1-9][0-9]* committed_calendar=true' "$RUNNER_TEMP/bounded-trade.log"
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2318D_ALLOCATION_PASS cycle=$cycle own=[1-9][0-9]* .* actual_calendar=true$" "$RUNNER_TEMP/bounded-trade.log"
          done
          if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|GA_NEXT_FINE_HUMAN_AI_REJECTED|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/bounded-trade.log"; then exit 1; fi
      - name: Exercise one-worker opening with individual commodity demand
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_BOUNDED_TRADE_PREVIEW: '1'
          GA_NEXT_R2318_UNIT_OPENING_PREVIEW: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/unit-opening.log"
          grep -q 'GA_NEXT_R2315_DEMOGRAPHIC_PASS cycles=3' "$RUNNER_TEMP/unit-opening.log"
          grep -q 'GA_NEXT_R2318_OPENING_REFERENCE workers=2' "$RUNNER_TEMP/unit-opening.log"
          grep -q 'GA_NEXT_R2318_UNIT_OPENING_PASS cycles=9' "$RUNNER_TEMP/unit-opening.log"
          grep -E 'GA_NEXT_R2318E_EQUAL_SAMPLE_PASS samples=1024 .* uncommitted=true$' "$RUNNER_TEMP/unit-opening.log"
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2318E_BIRTH_AUDIT_PASS cycle=$cycle .* actual_batch=true$" "$RUNNER_TEMP/unit-opening.log"
          done
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2318D_ALLOCATION_PASS cycle=$cycle own=[1-9][0-9]* .* actual_calendar=true$" "$RUNNER_TEMP/unit-opening.log"
          done
          if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|GA_NEXT_FINE_HUMAN_AI_REJECTED|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/unit-opening.log"; then exit 1; fi
      - name: Exercise one-worker opening with per-civilization births
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_BOUNDED_TRADE_PREVIEW: '1'
          GA_NEXT_R2318_UNIT_OPENING_PREVIEW: '1'
          GA_NEXT_R2319_INDIVIDUAL_DEMOGRAPHY: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/individual-demography.log"
          grep -q 'GA_NEXT_R2315_DEMOGRAPHIC_PASS cycles=3' "$RUNNER_TEMP/individual-demography.log"
          grep -q 'GA_NEXT_R2318_OPENING_REFERENCE workers=2' "$RUNNER_TEMP/individual-demography.log"
          grep -q 'GA_NEXT_R2318_UNIT_OPENING_PASS cycles=9' "$RUNNER_TEMP/individual-demography.log"
          grep -q 'GA_NEXT_R2319_INDIVIDUAL_PASS cycles=9 population_per_owner=10 replay=true' "$RUNNER_TEMP/individual-demography.log"
          grep -E 'GA_NEXT_R2319_WEIGHT_SAMPLE_PASS samples=256 .* uncommitted=true$' "$RUNNER_TEMP/individual-demography.log"
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2319_BIRTH_PASS cycle=$cycle owners=2 one_per_owner=true weights=true$" "$RUNNER_TEMP/individual-demography.log"
          done
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2318D_ALLOCATION_PASS cycle=$cycle own=[1-9][0-9]* .* actual_calendar=true$" "$RUNNER_TEMP/individual-demography.log"
          done
          if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|GA_NEXT_FINE_HUMAN_AI_REJECTED|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/individual-demography.log"; then exit 1; fi
      - name: Exercise uniform city births and actual transit exclusion
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_BOUNDED_TRADE_PREVIEW: '1'
          GA_NEXT_R2318_UNIT_OPENING_PREVIEW: '1'
          GA_NEXT_R23112_UNIFORM_CITY_DEMOGRAPHY: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
          GA_NEXT_R232_TURN_PROFILE: '1'
          GA_NEXT_R232_PROFILE_THROUGH_CYCLE: '50'
          GA_NEXT_R232D_DISPERSED_PROFILE: '1'
          GA_NEXT_R232E_MANAGED_BUILD: 'debug'
        run: |
          set -o pipefail
          timeout 600 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_R2315_DEMOGRAPHIC_PASS cycles=3' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_R2318_OPENING_REFERENCE workers=2' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_R2318_UNIT_OPENING_PASS cycles=9' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_R23112_UNIFORM_PASS cycles=9 population_per_owner=10 replay=true' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_R23111_SITE_COLORS_PASS red=true blue=true mixed_policy=true white_border=true hash_unchanged=true' "$RUNNER_TEMP/uniform-city.log"
          grep -E 'GA_NEXT_R23112_CITY_SAMPLE_PASS samples=256 .* transit_excluded=true all_travel_skipped=true uncommitted=true$' "$RUNNER_TEMP/uniform-city.log"
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R23112_BIRTH_PASS cycle=$cycle owners=2 uniform_city=true replay=true$" "$RUNNER_TEMP/uniform-city.log"
          done
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2318D_ALLOCATION_PASS cycle=$cycle own=[1-9][0-9]* .* actual_calendar=true$" "$RUNNER_TEMP/uniform-city.log"
          done
          grep -q 'GA_NEXT_R23112_TRANSIT_PASS actual_crossing=true birth_skipped=true resumed_at_destination=true no_carry=true replay=true' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_R232_SCALE_PASS through=50 population=101 actual_closes=true replay=true' "$RUNNER_TEMP/uniform-city.log"

          sed -nE 's/^GA_NEXT_R232_TURN cycle=([0-9]+) .* replay=True hash=WorldStateHash \{ FormatVersion = 26, HexDigest = ([A-F0-9]{64}) \} inclusive=true$/\1 \2/p' "$RUNNER_TEMP/uniform-city.log" | awk '$1 <= 50' > "$RUNNER_TEMP/r232b-hashes.txt"
          diff -u docs/fixtures/GA-NEXT-R232A-UNIFORM-CITY-50-HASHES.txt "$RUNNER_TEMP/r232b-hashes.txt"
          echo 'GA_NEXT_R232B_BASELINE_EQUIVALENCE_PASS cycles=50 hash_v=26'
          grep -E 'GA_NEXT_R232D_DISPERSED_PASS through=100 population=201 own_sites=8 moves=7 travel_closes=[1-9][0-9]* stationary_closes=[1-9][0-9]* max_edges=[1-9][0-9]* positive_trade=true replay=true$' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_VISUAL02A_LABELS_PASS pure_collision=true actual_sites=8 dots_preserved=true hash_unchanged=true' "$RUNNER_TEMP/uniform-city.log"
          grep -q 'GA_NEXT_VISUAL02B_TRADE_HIERARCHY_PASS actual_cycles=100 atlas_core_cap=6.5 atlas_rim=0.75 tactical_unchanged=true hash_unchanged=true' "$RUNNER_TEMP/uniform-city.log"
          for cycle in $(seq 51 100); do
            grep -E "GA_NEXT_R232D_CYCLE cycle=$cycle stage=(expansion|stationary) own_sites=[1-9][0-9]* workers=[1-9][0-9]* edges=[0-9]+ traveled=(True|False) replay=true$" "$RUNNER_TEMP/uniform-city.log"
          done
          for cycle in $(seq 1 100); do
            grep -E "GA_NEXT_R232_TURN cycle=$cycle .* replay=True .* inclusive=true$" "$RUNNER_TEMP/uniform-city.log"
            for phase in turn_total host_close worker_calendar automatic_allocation market_distribution financial_accounting demography independent_replay canonical_hash trade_publication ui_attach ui_refresh; do
              grep -E "GA_NEXT_R232_PHASE cycle=$cycle phase=$phase calls=[1-9][0-9]* elapsed_us=[0-9]+ allocated_bytes=[0-9]+$" "$RUNNER_TEMP/uniform-city.log" >/dev/null
            done
          done
          if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|GA_NEXT_FINE_HUMAN_AI_REJECTED|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/uniform-city.log"; then exit 1; fi
      - name: Rebuild optimized CSharp assemblies in the same Godot Debug load path
        run: dotnet build tools/GlobalArena.Godot -c Debug --no-incremental -p:Optimize=true
      - name: Exercise identical 100-cycle scenario with optimized managed assemblies
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_BOUNDED_TRADE_PREVIEW: '1'
          GA_NEXT_R2318_UNIT_OPENING_PREVIEW: '1'
          GA_NEXT_R23112_UNIFORM_CITY_DEMOGRAPHY: '1'
          GA_NEXT_R213_UI_SMOKE: '1'
          GA_NEXT_R232_TURN_PROFILE: '1'
          GA_NEXT_R232_PROFILE_THROUGH_CYCLE: '50'
          GA_NEXT_R232D_DISPERSED_PROFILE: '1'
          GA_NEXT_R232E_MANAGED_BUILD: 'optimized'
        run: |
          set -o pipefail
          timeout 600 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility 2>&1 | tee "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_R2315_DEMOGRAPHIC_PASS cycles=3' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_R2318_OPENING_REFERENCE workers=2' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_R2318_UNIT_OPENING_PASS cycles=9' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_R23112_UNIFORM_PASS cycles=9 population_per_owner=10 replay=true' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_R23111_SITE_COLORS_PASS red=true blue=true mixed_policy=true white_border=true hash_unchanged=true' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -E 'GA_NEXT_R23112_CITY_SAMPLE_PASS samples=256 .* transit_excluded=true all_travel_skipped=true uncommitted=true$' "$RUNNER_TEMP/uniform-city-optimized.log"
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R23112_BIRTH_PASS cycle=$cycle owners=2 uniform_city=true replay=true$" "$RUNNER_TEMP/uniform-city-optimized.log"
          done
          for cycle in {1..9}; do
            grep -E "GA_NEXT_R2318D_ALLOCATION_PASS cycle=$cycle own=[1-9][0-9]* .* actual_calendar=true$" "$RUNNER_TEMP/uniform-city-optimized.log"
          done
          grep -q 'GA_NEXT_R23112_TRANSIT_PASS actual_crossing=true birth_skipped=true resumed_at_destination=true no_carry=true replay=true' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_R232_SCALE_PASS through=50 population=101 actual_closes=true replay=true' "$RUNNER_TEMP/uniform-city-optimized.log"

          sed -nE 's/^GA_NEXT_R232_TURN cycle=([0-9]+) .* replay=True hash=WorldStateHash \{ FormatVersion = 26, HexDigest = ([A-F0-9]{64}) \} inclusive=true$/\1 \2/p' "$RUNNER_TEMP/uniform-city-optimized.log" | awk '$1 <= 50' > "$RUNNER_TEMP/r232e-optimized-50-hashes.txt"
          diff -u docs/fixtures/GA-NEXT-R232A-UNIFORM-CITY-50-HASHES.txt "$RUNNER_TEMP/r232e-optimized-50-hashes.txt"
          echo 'GA_NEXT_R232B_BASELINE_EQUIVALENCE_PASS cycles=50 hash_v=26'
          grep -E 'GA_NEXT_R232D_DISPERSED_PASS through=100 population=201 own_sites=8 moves=7 travel_closes=[1-9][0-9]* stationary_closes=[1-9][0-9]* max_edges=[1-9][0-9]* positive_trade=true replay=true$' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_VISUAL02A_LABELS_PASS pure_collision=true actual_sites=8 dots_preserved=true hash_unchanged=true' "$RUNNER_TEMP/uniform-city-optimized.log"
          grep -q 'GA_NEXT_VISUAL02B_TRADE_HIERARCHY_PASS actual_cycles=100 atlas_core_cap=6.5 atlas_rim=0.75 tactical_unchanged=true hash_unchanged=true' "$RUNNER_TEMP/uniform-city-optimized.log"
          for cycle in $(seq 51 100); do
            grep -E "GA_NEXT_R232D_CYCLE cycle=$cycle stage=(expansion|stationary) own_sites=[1-9][0-9]* workers=[1-9][0-9]* edges=[0-9]+ traveled=(True|False) replay=true$" "$RUNNER_TEMP/uniform-city-optimized.log"
          done
          for cycle in $(seq 1 100); do
            grep -E "GA_NEXT_R232_TURN cycle=$cycle .* replay=True .* inclusive=true$" "$RUNNER_TEMP/uniform-city-optimized.log"
            for phase in turn_total host_close worker_calendar automatic_allocation market_distribution financial_accounting demography independent_replay canonical_hash trade_publication ui_attach ui_refresh; do
              grep -E "GA_NEXT_R232_PHASE cycle=$cycle phase=$phase calls=[1-9][0-9]* elapsed_us=[0-9]+ allocated_bytes=[0-9]+$" "$RUNNER_TEMP/uniform-city-optimized.log" >/dev/null
            done
          done
          if grep -E 'GA_NEXT_R213_PERSISTENT_UI_FAIL|GA_NEXT_FINE_HUMAN_AI_REJECTED|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/uniform-city-optimized.log"; then exit 1; fi
      - name: Compare matched managed builds against approved 100-cycle reference
        run: |
          python3 tools/qa/compare_r232e_profiles.py \
            "$RUNNER_TEMP/uniform-city.log" "$RUNNER_TEMP/uniform-city-optimized.log" \
            docs/fixtures/GA-NEXT-R232D-DISPERSED-100-HASHES.txt "$RUNNER_TEMP/r232e-comparison.json"
      - name: Verify recalibrated coastal freight in signed autonomous preview
        env:
          GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW: '1'
          GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW: '1'
          GA_NEXT_QA_LOCAL_SITE_MARKERS: '1'
          GA_NEXT_CONSTRUCTION_PREVIEW: '1'
          GA_NEXT_PERSISTENT_ORDERS: '1'
          GA_NEXT_CROP_PREVIEW: '1'
          GA_NEXT_LOCAL_ECONOMY_PREVIEW: '1'
          GA_NEXT_DEMOGRAPHIC_PREVIEW: '1'
          GA_NEXT_BOUNDED_TRADE_PREVIEW: '1'
          GA_NEXT_R2318_UNIT_OPENING_PREVIEW: '1'
          GA_NEXT_R23112_UNIFORM_CITY_DEMOGRAPHY: '1'
          GA_NEXT_R233E_AUTONOMOUS_AI: '1'
          GA_NEXT_R234A_COASTAL_FREIGHT: '1'
        run: |
          set -o pipefail
          timeout 180 "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --rendering-method gl_compatibility --quit-after 30 2>&1 | tee "$RUNNER_TEMP/r234a-coast.log"
          grep -E 'GA_NEXT_R234A_COASTAL_FREIGHT_PASS land_base=250000 coast=1000000 sea=25000 ports=[1-9][0-9]* signed=true' "$RUNNER_TEMP/r234a-coast.log"
          grep -q 'GA_NEXT_R233E_AUTONOMOUS_AI_READY' "$RUNNER_TEMP/r234a-coast.log"
          if grep -E 'SCRIPT ERROR|Unhandled Exception|GA_NEXT_FINE_HUMAN_AI_REJECTED' "$RUNNER_TEMP/r234a-coast.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r213-ui-log
          path: |
            ${{ runner.temp }}/r213.log
            ${{ runner.temp }}/crops.log
            ${{ runner.temp }}/local-economy.log
            ${{ runner.temp }}/trade-remote.log
            ${{ runner.temp }}/trade-local.log
            ${{ runner.temp }}/demographic.log
            ${{ runner.temp }}/bounded-trade.log
            ${{ runner.temp }}/unit-opening.log
            ${{ runner.temp }}/individual-demography.log
            ${{ runner.temp }}/uniform-city.log
            ${{ runner.temp }}/r232b-hashes.txt
            ${{ runner.temp }}/uniform-city-optimized.log
            ${{ runner.temp }}/r232e-optimized-50-hashes.txt
            ${{ runner.temp }}/r232e-comparison.json
            ${{ runner.temp }}/r234a-coast.log
