name: GA-Next #435 — QA capacity-only A/B (no canonical calibration)

on:
  pull_request:
    paths:
      - 'GlobalArena.Tests/FoundationNaturalCapacitySweepTests.cs'
      - '.github/workflows/ga-next-435-capacity-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freight-k-sweep:
    name: Frozen-census capacity sensitivity / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile & compare four closed-quote candidate cycles across five QA K profiles
        shell: pwsh
        run: |
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter FullyQualifiedName~FoundationNaturalCapacitySweepTests --logger "console;verbosity=detailed" --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
