name: GA Gate09 ADR053 Worker-Sourced Commercial Demand Coverage

on:
  pull_request:
    paths:
      - 'experiments/gate09/adr053_market_coverage/**'
      - 'docs/ga-gate09-adr053-worker-demand-coverage-draft.md'
      - '.github/workflows/ga-gate09-adr053-market-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-demand-coverage:
    name: ADR053 48 to 96 F072 demand nodes and 192 2048 spatial ledgers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout original F072 and worker population lab
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 28 original F072, worker coverage and mandatory 96-node regression contracts
        run: python -m unittest discover -s experiments/gate09/adr053_market_coverage/tests -p 'test_*.py' -v
      - name: Mandatory 48-node F072 baseline plus bounded 96-node F072 trial and 192 2048-node ledgers
        run: python -u experiments/gate09/adr053_market_coverage/ci/run_adr053.py --profile ci --output '${{ runner.temp }}'
      - name: Upload independent commercial PASS and NO-GO with full work counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr053-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR053-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
