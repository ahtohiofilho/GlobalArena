name: GA-Next R164 Temporal Physical Presence And Demography

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalPresenceDemographicProjector.cs'
      - 'GlobalArena.Tests/FoundationPhysicalPresenceDemographicTests.cs'
      - '.github/workflows/ga-next-r164-temporal-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-presence:
    name: R164 worker time, demand, work and birth lottery / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile physical temporal presence and demography
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Test exact 40/60 effort and consumption with deterministic noncity births
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalPresenceDemographicTests|FullyQualifiedName~FoundationCityResidenceRuntimeTests|FullyQualifiedName~FoundationDemographicGrowthPlannerTests' --logger 'console;verbosity=detailed'
      - name: State the contractual boundary
        run: |
          echo '### R164 — temporal presence, demand and demographic birth weights' >> "$GITHUB_STEP_SUMMARY"
          echo 'Physical node/civilization worker-time determines birth probabilities. Natal node is recorded even with no city. Old home residence and the authoritative movement/economic cycle remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
