name: GA-Next R67 — world-bound owner-specific maritime proof

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalWorldBoundMaritimeFreightProof.cs'
      - 'GlobalArena.Tests/FoundationPhysicalWorldBoundMaritimeFreightProofTests.cs'
      - '.github/workflows/ga-next-r67-world-bound-freight-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-bound-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check canonical-world and owner-specific maritime lower-bound contract
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationPhysicalWorldBoundMaritimeFreightProofTests|FullyQualifiedName~FoundationPhysicalMaritimeMarginalFreightBoundTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r67-evidence.log
      - name: Archive contract regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-r67-world-bound-marginal-freight
          path: ga-next-r67-evidence.log
          retention-days: 14
