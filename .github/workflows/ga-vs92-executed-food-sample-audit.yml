name: GA-VS92 Executed Food Sample Representativeness Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ga-vs92-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  executed-food-sample-audit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: GA-VS40 to GA-VS92 directed economic regressions
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs92|FullyQualifiedName~GaVs91|FullyQualifiedName~GaVs90|FullyQualifiedName~GaVs89|FullyQualifiedName~GaVs88|FullyQualifiedName~GaVs87|FullyQualifiedName~GaVs86|FullyQualifiedName~GaVs85|FullyQualifiedName~GaVs84|FullyQualifiedName~GaVs83|FullyQualifiedName~GaVs82|FullyQualifiedName~GaVs81|FullyQualifiedName~GaVs80|FullyQualifiedName~GaVs79|FullyQualifiedName~GaVs78|FullyQualifiedName~GaVs77|FullyQualifiedName~GaVs76|FullyQualifiedName~GaVs75|FullyQualifiedName~GaVs74|FullyQualifiedName~GaVs73|FullyQualifiedName~GaVs72|FullyQualifiedName~GaVs71|FullyQualifiedName~GaVs70|FullyQualifiedName~GaVs69|FullyQualifiedName~GaVs68|FullyQualifiedName~GaVs67|FullyQualifiedName~GaVs66|FullyQualifiedName~GaVs65|FullyQualifiedName~GaVs64|FullyQualifiedName~GaVs63|FullyQualifiedName~GaVs62|FullyQualifiedName~GaVs61|FullyQualifiedName~GaVs60|FullyQualifiedName~GaVs59|FullyQualifiedName~GaVs58|FullyQualifiedName~GaVs57|FullyQualifiedName~GaVs56|FullyQualifiedName~GaVs55|FullyQualifiedName~GaVs54|FullyQualifiedName~GaVs53|FullyQualifiedName~GaVs52|FullyQualifiedName~GaVs51|FullyQualifiedName~GaVs50|FullyQualifiedName~GaVs49|FullyQualifiedName~GaVs48|FullyQualifiedName~GaVs47|FullyQualifiedName~GaVs46|FullyQualifiedName~GaVs45|FullyQualifiedName~GaVs44|FullyQualifiedName~GaVs43|FullyQualifiedName~GaVs42|FullyQualifiedName~GaVs41|FullyQualifiedName~GaVs40"
      - name: Executed food sample audit 8 32 128
        run: dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj -c Release -- --vs92-executed-food-sample-audit
      - name: Godot Mono Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  executed-food-sample-audit-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Full project regression suite
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Executed food sample audit 8 32 128
        run: dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj -c Release -- --vs92-executed-food-sample-audit
      - name: Godot Mono Debug
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
