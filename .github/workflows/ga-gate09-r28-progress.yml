name: GA Gate09 R28 Progress Per Oracle

on:
  pull_request:
    paths:
      - 'experiments/gate09/r28/**'
      - 'docs/ga-gate09-r28-progress-per-oracle-draft.md'
      - '.github/workflows/ga-gate09-r28-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-search:
    name: R28 guarded economic progress / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run gated search contracts and immutable economics audits
        run: python -m unittest discover -s experiments/gate09/r28/tests -p 'test_*.py' -v
      - name: Compare guarded progress per oracle with frozen references
        run: python experiments/gate09/r28/ci/run_r28.py --profile ci --output '${{ runner.temp }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r28-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R28-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
