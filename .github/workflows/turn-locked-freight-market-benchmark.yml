name: Turn-Locked Freight Market Reference Benchmark

on:
  # Ordinary PRs use FAST. Full lanes are checkpoint-only.
  # Add ga-ci-checkpoint for cross-platform review, ga-ci-full before merge.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    # A skipped checkpoint is NOT evidence of a successful full regression.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ga-ci-checkpoint') ||
      contains(github.event.pull_request.labels.*.name, 'ga-ci-full')
    name: Reference benchmark on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Capture platform
        run: dotnet --info > platform.txt

      - name: Restore benchmark
        run: dotnet restore GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj

      - name: Build benchmark
        run: dotnet build GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj --configuration Release --no-restore

      - name: Benchmark reference with and without diagnostics
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj --configuration Release --no-build -- --turn-freight-market 2>&1 | tee turn-freight-market-benchmark.txt

      - name: Benchmark complete fine economic close
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj --configuration Release --no-build -- --fine-economic-cycle 2>&1 | tee fine-economic-cycle-benchmark.txt

      - name: Benchmark changing fine-world economic close sequence
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj --configuration Release --no-build -- --fine-economic-sequence 2>&1 | tee fine-economic-sequence-benchmark.txt

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turn-freight-market-${{ matrix.os }}
          path: |
            platform.txt
            turn-freight-market-benchmark.txt
            fine-economic-cycle-benchmark.txt
            fine-economic-sequence-benchmark.txt
          if-no-files-found: warn
