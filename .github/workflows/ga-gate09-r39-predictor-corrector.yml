name: GA Gate09 R39 Two-Stage Predictor Corrector Solver Trial

on:
  pull_request:
    paths:
      - 'experiments/gate09/r39/**'
      - 'docs/ga-gate09-r39-extragradient-solver-trial-draft.md'
      - '.github/workflows/ga-gate09-r39-predictor-corrector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-comparison:
    name: R39 second-family numerical solver / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full repricing of both stages and frozen economy
        run: python -m unittest discover -s experiments/gate09/r39/tests -p 'test_*.py' -v
      - name: Compare second solver family against R21 and R26 under matched R14 ceilings
        run: python experiments/gate09/r39/ci/run_r39.py --profile ci --output '${{ runner.temp }}'
      - name: Upload priced prediction correction and GO-NO-GO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r39-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R39-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
