name: GA-VS19B Civilization Born with Population

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/CanonicalPhysicalTacticalSession.cs'
      - 'GlobalArena.Simulation/CanonicalWorldStateHasher.cs'
      - 'GlobalArena.Simulation/CivilizationalEconomicAttributionProjection.cs'
      - 'GlobalArena.Tests/GaVs19BBornCivilizationTests.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
      - 'tools/launch-vs19b.ps1'
      - '.github/workflows/ga-vs19b-born-civilization.yml'
  workflow_dispatch:

jobs:
  civilization-genesis-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: New civilization identity and legacy V13 replay
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs19B|FullyQualifiedName~GaVs18|FullyQualifiedName~GaVs17|FullyQualifiedName~GaVs16|FullyQualifiedName~GaVs15'
      - name: Build Godot Linux
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  civilization-genesis-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: New civilization identity and legacy V13 replay
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs19B|FullyQualifiedName~GaVs18|FullyQualifiedName~GaVs17|FullyQualifiedName~GaVs16|FullyQualifiedName~GaVs15'
      - name: Validate exact-project Windows launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/launch-vs19b.ps1').Path,
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $script = Get-Content -Raw -Encoding UTF8 'tools/launch-vs19b.ps1'
          $main = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.cs'
          if (-not $script.Contains('& dotnet build') -or
              -not $script.Contains('-c Debug') -or
              -not $script.Contains('& $GodotExe --path $projectDir --verbose') -or
              (-not $main.Contains('GA_VS19B_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS19C_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS20_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS21_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS22_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS23_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS24_RUNTIME_ACTIVE') -and
               (-not $main.Contains('GA_VS25_RUNTIME_ACTIVE') -and (-not $main.Contains('GA_VS26_RUNTIME_ACTIVE') -and -not $main.Contains('GA_VS27_RUNTIME_ACTIVE'))))) {
            throw "VS19B+ Windows launch must build Debug and provide an identifying runtime log."
          }
      - name: Build Godot Windows (Debug launch target)
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Build Godot Windows (Release regression)
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
