name: GA-Next R176 Multi-Producer Market Pass Audit

on:
  pull_request:
    paths:
      - "GlobalArena.Tests/FoundationMarginalMarketComplexityAuditTests.cs"
      - ".github/workflows/ga-next-r176-multi-producer-audit.yml"
      - "docs/GA-NEXT-R176-MULTI-PRODUCER-AUDIT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: R176 three real producer lots marginal value / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Compare multi-producer per-pass net value
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~FoundationMarginalMarketComplexityAuditTests" --logger "console;verbosity=detailed"
