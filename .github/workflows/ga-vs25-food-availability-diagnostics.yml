name: GA-VS25 Canonical Food Availability Diagnostics

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/PhysicalFoodAvailabilityProjection.cs'
      - 'GlobalArena.Tests/GaVs25FoodAvailabilityProjectionTests.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.cs'
      - 'tools/launch-vs25.ps1'
      - '.github/workflows/ga-vs25-food-availability-diagnostics.yml'
      - '.github/workflows/ga-vs24-worker-decision-comparison.yml'
      - '.github/workflows/ga-vs23-multicycle-economic-outcomes.yml'
      - '.github/workflows/ga-vs22-economic-cycle-visibility.yml'
      - '.github/workflows/ga-vs21-local-worker-reallocation.yml'
      - '.github/workflows/ga-vs20-emergent-settlements.yml'
      - '.github/workflows/ga-vs19b-born-civilization.yml'
      - '.github/workflows/ga-vs19c-operational-hud.yml'
  workflow_dispatch:

jobs:
  food-availability-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Food availability balance and prior canonical-economic tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs25|FullyQualifiedName~GaVs24|FullyQualifiedName~GaVs23|FullyQualifiedName~GaVs22|FullyQualifiedName~GaVs21|FullyQualifiedName~GaVs20'
      - name: Build Godot Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  food-availability-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify PowerShell launcher and food-diagnostic immutability
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/launch-vs25.ps1').Path,
            [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | ForEach-Object Message | Out-String) }
          $runner = Get-Content -Raw -Encoding UTF8 'tools/launch-vs25.ps1'
          $main = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.cs'
          $lab = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
          $proj = Get-Content -Raw -Encoding UTF8 'GlobalArena.Simulation/PhysicalFoodAvailabilityProjection.cs'
          if (-not $runner.Contains('feature/ga-vs25-food-availability-diagnostics-20261031') -or
              -not $runner.Contains('-c Debug') -or
              -not $runner.Contains('& $GodotExe --path $projectDir --verbose') -or
              -not $main.Contains('GA_VS25_RUNTIME_ACTIVE') -or
              -not $lab.Contains('DiagnoseNextFoodCycleWithoutCommitting') -or
              -not $lab.Contains('PhysicalFoodAvailabilityProjection.PreviewNextCycle') -or
              -not $lab.Contains('CompareWorkerDecisionWithoutCommitting') -or
              -not $proj.Contains('RestoreSaveJson') -or
              -not $proj.Contains('PhysicalShortageRaw') -or
              -not $proj.Contains('UnconsumedDespiteSupplyRaw')) {
            throw 'VS25 read-only physical food balance or Windows launcher contract missing.'
          }
      - name: Food availability balance and prior canonical-economic tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs25|FullyQualifiedName~GaVs24|FullyQualifiedName~GaVs23|FullyQualifiedName~GaVs22|FullyQualifiedName~GaVs21|FullyQualifiedName~GaVs20'
      - name: Build Godot Debug
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Build Godot Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
