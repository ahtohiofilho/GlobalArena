name: GA-Next R157 Trade-Preserving Logistics AB

on:
  pull_request:
    paths:
      - 'GlobalArena.Tests/FoundationOperationalEconomicCounterfactualTests.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationOperationalEconomicCounterfactualProjector.cs'
      - '.github/workflows/ga-next-r157-trade-preserving-logistics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logistics-ab:
    name: R157 trade-preserving real economic AB / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build unchanged kernel and experimental tests
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Evaluate real trade after a wood worker moves to land logistics
        env:
          GA_R157_REPORT_DIR: ${{ runner.temp }}/ga-next-r157-trade
        run: |
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~TradePreservingLogisticsComparisonMeasuresRealUsedCrossings' --logger 'console;verbosity=detailed'
          test -s "$GA_R157_REPORT_DIR/r157-trade-preserving.json"
      - name: Publish independent exact monetary results
        env:
          GA_R157_REPORT_DIR: ${{ runner.temp }}/ga-next-r157-trade
        run: |
          echo 'GA_NEXT_R157_TRADE_PRESERVING_REPORT'
          cat "$GA_R157_REPORT_DIR/r157-trade-preserving.json"
          echo '### R157 — Relocating one existing wood producer' >> "$GITHUB_STEP_SUMMARY"
          echo 'Three pre-commit markets; no real treasury changes or congestion.' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          cat "$GA_R157_REPORT_DIR/r157-trade-preserving.json" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive scenario numbers
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-r157-trade-preserving-ab
          path: ${{ runner.temp }}/ga-next-r157-trade/r157-trade-preserving.json
          if-no-files-found: error
