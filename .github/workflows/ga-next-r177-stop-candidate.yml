name: GA-Next R177 Economic Stop Candidate Audit

on:
  pull_request:
    paths:
      - "GlobalArena.Simulation/Foundation/FoundationMarginalEconomicStopCandidate.cs"
      - "GlobalArena.Tests/FoundationMarginalMarketComplexityAuditTests.cs"
      - ".github/workflows/ga-next-r177-stop-candidate.yml"
      - "docs/GA-NEXT-R177-STOP-CANDIDATE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    name: R177 1bp versus 10bp stop candidates / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Compile tests and comparison logic
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Compare early-stop candidates to certified passes
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~FoundationMarginalMarketComplexityAuditTests" --logger "console;verbosity=detailed"
