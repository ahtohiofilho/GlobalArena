name: GA-VS103 Dormant Treasury Reservation HUD Gate

on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/**'
      - 'GlobalArena.Runtime/**'
      - 'GlobalArena.Simulation/**'
      - 'GlobalArena.Tests/**'
      - '.github/workflows/ga-vs103-treasury-reservation-hud.yml'
  workflow_dispatch:

concurrency:
  group: ga-vs103-treasury-hud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  treasury-hud-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "GA_CHECKOUT_SHA=$EXPECTED_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: VS101 and VS102 dormant treasury persistence regressions
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs101DormantTreasuryPersistenceTests|FullyQualifiedName~GaVs102IntegratedTreasurySaveTests"
      - name: Godot Mono Linux Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  treasury-hud-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "GA_CHECKOUT_SHA=$EXPECTED_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: VS101 and VS102 dormant treasury persistence regressions
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs101DormantTreasuryPersistenceTests|FullyQualifiedName~GaVs102IntegratedTreasurySaveTests"
      - name: Godot Mono Windows Debug
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Godot Mono Windows Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
