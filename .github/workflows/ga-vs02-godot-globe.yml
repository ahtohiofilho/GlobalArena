name: GA-VS02 Godot Globe And CSharp Gameplay Bridge

on:
  pull_request:
    paths:
      - 'GlobalArena.Godot/**'
      - 'GlobalArena.Console/**'
      - 'GlobalArena.Simulation/**'
      - 'tools/ci/ga-vs02-godot-bridge-smoke.py'
      - '.github/workflows/ga-vs02-godot-globe.yml'
  workflow_dispatch:

jobs:
  real-godot-scene-and-csharp-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build C# gameplay and JSON bridge
        run: dotnet build GlobalArena.Console/GlobalArena.Console.csproj -c Release
      - name: Assert geometry, deterministic replay, worker conservation and rejected moves
        run: python3 tools/ci/ga-vs02-godot-bridge-smoke.py
      - name: Download pinned Godot 4.4.1 Linux standard runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            --output /tmp/ga-godot.zip
          unzip -q /tmp/ga-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and parse actual Godot 4 scene
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path GlobalArena.Godot --editor --quit 2>&1 | tee /tmp/ga-godot-import.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|Failed to load script|GDScript::reload)' /tmp/ga-godot-import.log; then
            exit 1
          fi
      - name: Run actual Godot scene click selection, founding and preview against C# motor
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path GlobalArena.Godot \
            --script res://tests/ga_vs02_scene_smoke.gd \
            2>&1 | tee /tmp/ga-vs02-godot.log
          grep -q 'GA-VS02-GODOT-SMOKE-PASS' /tmp/ga-vs02-godot.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|GA-VS02 GODOT FAIL)' /tmp/ga-vs02-godot.log; then
            exit 1
          fi
