name: GA Gate09 ADR043 Continuous Inverse-Score VI Contract

on:
  pull_request:
    paths:
      - 'experiments/gate09/inverse_vi_contract/**'
      - 'docs/ga-gate09-adr043-*.md'
      - '.github/workflows/ga-gate09-adr043-inverse-vi-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-contract:
    name: ADR043 reciprocal VI mathematical witnesses / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reciprocal-cost parity, boundary, nonuniqueness and existing F072
        run: python -m unittest discover -s experiments/gate09/inverse_vi_contract/tests -p 'test_*.py' -v
      - name: Archive 8 frozen read-only analytical witnesses
        run: python experiments/gate09/inverse_vi_contract/ci/verify_inverse_vi.py --output '${{ runner.temp }}'
      - name: Upload mathematical VI formulation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr043-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR043-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
