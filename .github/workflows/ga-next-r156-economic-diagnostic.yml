name: GA-Next R156 Real Economic Diagnostic Report

on:
  pull_request:
    paths:
      - 'GlobalArena.Tests/FoundationOperationalEconomicCounterfactualTests.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationOperationalEconomicAssessmentProjector.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationOperationalEconomicCounterfactualProjector.cs'
      - '.github/workflows/ga-next-r156-economic-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economic-diagnostic:
    name: R156 exact three-market economic report / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deterministic benchmark
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and compile canonical economic test
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release

      - name: R156 audit and export A/B/C real worker economic evidence
        env:
          GA_R156_REPORT_DIR: ${{ runner.temp }}/ga-next-r156-economic
        run: |
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~QuantitativeTransferAndLogisticsEffectsReconcileWithoutAssumingProfit' --logger 'console;verbosity=detailed'
          test -s "$GA_R156_REPORT_DIR/r156-economic-diagnostic.json"
          test -s "$GA_R156_REPORT_DIR/r156-economic-diagnostic.md"

      - name: Show exact results in run log and GitHub job summary
        env:
          GA_R156_REPORT_DIR: ${{ runner.temp }}/ga-next-r156-economic
        run: |
          echo 'GA_NEXT_R156_ECONOMIC_REPORT_JSON'
          cat "$GA_R156_REPORT_DIR/r156-economic-diagnostic.json"
          echo 'GA_NEXT_R156_ECONOMIC_REPORT_MARKDOWN'
          cat "$GA_R156_REPORT_DIR/r156-economic-diagnostic.md"
          cat "$GA_R156_REPORT_DIR/r156-economic-diagnostic.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive exact and readable R156 reports
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-r156-economic-diagnostic
          path: ${{ runner.temp }}/ga-next-r156-economic/r156-economic-diagnostic.*
          if-no-files-found: error
