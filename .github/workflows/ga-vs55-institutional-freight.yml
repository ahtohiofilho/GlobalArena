name: GA-VS55 Institutional Freight Entitlement Lab

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/ExperimentalTransportInstitutionalFreightProjector.cs'
      - 'GlobalArena.Tests/GaVs55InstitutionalFreightEntitlementTests.cs'
      - 'GlobalArena.Benchmarks/GaVs55InstitutionalFreightBenchmarkHarness.cs'
      - 'GlobalArena.Benchmarks/Program.cs'
      - 'docs/engineering/GA-VS55-institutional-freight-entitlement.md'
      - '.github/workflows/ga-vs55-institutional-freight.yml'
  workflow_dispatch:

jobs:
  institutional-freight-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: GA-VS40 through GA-VS55 economic institutional tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs55|FullyQualifiedName~GaVs54|FullyQualifiedName~GaVs53|FullyQualifiedName~GaVs52|FullyQualifiedName~GaVs51|FullyQualifiedName~GaVs50|FullyQualifiedName~GaVs49|FullyQualifiedName~GaVs48|FullyQualifiedName~GaVs47|FullyQualifiedName~GaVs46|FullyQualifiedName~GaVs45|FullyQualifiedName~GaVs44|FullyQualifiedName~GaVs43|FullyQualifiedName~GaVs42|FullyQualifiedName~GaVs41|FullyQualifiedName~GaVs40"
      - name: Institutional freight read-only benchmark
        run: dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj -c Release -- --vs55-institutional-freight
      - name: Godot Mono Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  institutional-freight-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Full physical tactical economic checkpoint regression
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Godot Mono Debug
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
