name: GA-QA-VISUAL-002 Real Godot Screenshot & Geometry

on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/**'
      - '.github/workflows/ga-qa-ui-visual-002.yml'
  workflow_dispatch:

jobs:
  rendered-ui-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GA_UI_E2E_ISOLATED: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.ga-ui-e2e/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ga-ui-e2e/config
      XDG_CACHE_HOME: ${{ github.workspace }}/.ga-ui-e2e/cache
      GA_UI_VISUAL_ARTIFACT_DIR: ${{ github.workspace }}/.ga-ui-visual
      GODOT_PROJECT: ${{ github.workspace }}/tools/GlobalArena.Godot
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install virtual X11 display and Mesa software OpenGL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1
      - name: Download exactly Godot Mono 4.7.2 used by the .NET client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-dotnet" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$GA_UI_VISUAL_ARTIFACT_DIR"
          archive="$RUNNER_TEMP/godot-mono-4.7.2.zip"
          curl -fL --retry 4 --retry-delay 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-dotnet"
          godot="$(find "$RUNNER_TEMP/godot-dotnet" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
      - name: Compile Godot client and import actual scene resources
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
          timeout 150s "$GODOT_BIN" --headless --editor --path "$GODOT_PROJECT" --import --quit 2>&1 | tee "$RUNNER_TEMP/ga-visual-import.log"
      - name: Render strategic/tactical map with real mouse picking and assert layout
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --rendering-method gl_compatibility \
            --resolution 1600x900 --path "$GODOT_PROJECT" \
            --script res://Tests/UiVisualQA.gd 2>&1 | tee "$RUNNER_TEMP/ga-visual-runtime.log"
          grep -q '^GA_UI_VISUAL_GLOBE_PICK_OK' "$RUNNER_TEMP/ga-visual-runtime.log"
          grep -q '^GA_UI_VISUAL_PASS ' "$RUNNER_TEMP/ga-visual-runtime.log"
          if grep -q 'GA_UI_VISUAL_FAIL\|SCRIPT ERROR\|Unhandled exception' "$RUNNER_TEMP/ga-visual-runtime.log"; then
            echo "Rendered UI reported a runtime failure."
            exit 1
          fi
          test -s "$GA_UI_VISUAL_ARTIFACT_DIR/01-strategic.png"
          test -s "$GA_UI_VISUAL_ARTIFACT_DIR/02-tactical.png"
      - name: Publish actual screenshots and logs, including when a visual gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-qa-visual-002-screenshots
          path: |
            ${{ github.workspace }}/.ga-ui-visual/*.png
            ${{ runner.temp }}/ga-visual-*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
