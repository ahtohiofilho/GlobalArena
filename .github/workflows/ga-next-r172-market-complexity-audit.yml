name: GA-Next R172 Marginal Market Complexity Audit

on:
  pull_request:
    paths:
      - "GlobalArena.Tests/FoundationMarginalMarketComplexityAuditTests.cs"
      - ".github/workflows/ga-next-r172-market-complexity-audit.yml"
      - "docs/GA-NEXT-R172-MARKET-COMPLEXITY-DECISION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: R172 empirical market complexity diagnostics / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Measure existing marginal market, no timing assertions
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~FoundationMarginalMarketComplexityAuditTests" --logger "console;verbosity=detailed"
