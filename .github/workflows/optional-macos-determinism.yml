name: Optional macOS Determinism Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-determinism:
    name: Optional macOS deterministic hash and focused economics
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Capture platform
        run: dotnet --info > platform.txt
      - name: Restore
        run: dotnet restore GlobalArena.slnx
      - name: Build
        run: dotnet build GlobalArena.slnx --configuration Release --no-restore
      - name: Run deterministic state hash and temporal finance tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~CanonicalWorldStateHasherTests|FullyQualifiedName~FoundationTemporalEconomicJournalGateTests" --logger "trx;LogFileName=macos-determinism.trx" --results-directory artifacts
      - name: Upload optional audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optional-macos-determinism
          path: |
            platform.txt
            artifacts/macos-determinism.trx
          if-no-files-found: error
