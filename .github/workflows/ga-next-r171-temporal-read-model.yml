name: GA-Next R171 Temporal Close Read Model

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationViewerTemporalEconomicCloseProjector.cs'
      - 'GlobalArena.Tests/FoundationTemporalEconomicJournalGateTests.cs'
      - 'docs/GA-NEXT-DUAL-CI-GATES.md'
      - '.github/workflows/ga-next-r171-temporal-read-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-close:
    name: R171 viewer-scoped committed temporal close / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build original simulation and tests
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Validate R171 temporal read model and R170 journal
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationTemporalEconomicJournalGateTests|FullyQualifiedName~FoundationTemporalFinancialReconciliationTests' --logger 'console;verbosity=detailed'
