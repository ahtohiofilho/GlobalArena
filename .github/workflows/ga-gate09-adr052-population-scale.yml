name: GA Gate09 ADR052 Physical Worker Population and Spatial F072

on:
  pull_request:
    paths:
      - 'experiments/gate09/adr052_population_scale/**'
      - 'docs/ga-gate09-adr052-worker-population-spatial-scale-and-f072-gates-draft.md'
      - '.github/workflows/ga-gate09-adr052-population-scale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population-economics:
    name: ADR052 8192 worker spatial ledger and 2048-worker F072 pilot / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout immutable R13 source and ADR051 solver
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 26 worker-source, time-conservation, Goldberg aggregation contracts
        run: python -m unittest discover -s experiments/gate09/adr052_population_scale/tests -p 'test_*.py' -v
      - name: Run 8192-worker spatial physical ledger and bounded 2048-worker F072 pilot
        run: python -u experiments/gate09/adr052_population_scale/ci/run_adr052.py --profile ci --output '${{ runner.temp }}'
      - name: Preserve independent commercial PASS or NO-GO and worker demand ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr052-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR052-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
