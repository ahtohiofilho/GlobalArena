name: GA-VS08 Grounded Tactical Contours

on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/Scripts/TacticalContextPreview.cs'
      - 'tools/GlobalArena.Godot/Scripts/TacticalContextPreview.WorkerRings.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
      - 'tools/GlobalArena.Godot/project.godot'
      - 'tools/ci/ga-vs08-overlay-depth-contract.py'
      - '.github/workflows/ga-vs08-grounded-overlays.yml'
  workflow_dispatch:

jobs:
  grounded-overlays-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert all tactical overlay layers adhere to the physical surface
        run: python tools/ci/ga-vs08-overlay-depth-contract.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regress offline cycle, replay and worker topology
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs05|FullyQualifiedName~GaVs07'
      - name: Build original Godot CSharp viewer with grounded ribbons
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  grounded-overlays-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert surface attachment offsets on Windows
        run: python tools/ci/ga-vs08-overlay-depth-contract.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regress offline cycle and physical worker motion on Windows
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs05|FullyQualifiedName~GaVs07'
      - name: Build the original Godot CSharp viewer on Windows
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
