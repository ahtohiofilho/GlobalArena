name: G3-J3q Independent Signed Custody Audit

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/**'
      - 'GlobalArena.Tests/**'
      - '.github/workflows/ga-independent-custody-audit.yml'
  workflow_dispatch:

jobs:
  independently-signed-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tests
        run: dotnet restore GlobalArena.Tests/GlobalArena.Tests.csproj
      - name: Independent ledger ECDSA, retention, anti-replay and custody fail-closed
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~J3q" --logger "console;verbosity=normal"
