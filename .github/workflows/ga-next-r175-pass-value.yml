name: GA-Next R175 Per-Pass Net Marginal Value

on:
  pull_request:
    paths:
      - "GlobalArena.Simulation/Foundation/FoundationPhysicalGlobalMarginalCoordinator.cs"
      - "GlobalArena.Tests/FoundationMarginalMarketComplexityAuditTests.cs"
      - ".github/workflows/ga-next-r175-pass-value.yml"
      - "docs/GA-NEXT-R175-PASS-BENEFIT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: R175 immutable per-pass net benefit on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Compare successive real-freight market passes
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~FoundationMarginalMarketComplexityAuditTests" --logger "console;verbosity=detailed"
