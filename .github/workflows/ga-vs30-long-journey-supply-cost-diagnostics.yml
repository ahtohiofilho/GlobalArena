name: GA-VS30 Travel Provisioning and Opportunity Diagnostics

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/PhysicalJourneySupplyProjection.cs'
      - 'GlobalArena.Simulation/CanonicalPhysicalTacticalSession.cs'
      - 'GlobalArena.Tests/GaVs30LongJourneySupplyDiagnosticsTests.cs'
      - 'tools/GlobalArena.Godot/**'
      - 'tools/launch-vs30.ps1'
      - '.github/workflows/ga-vs30-long-journey-supply-cost-diagnostics.yml'
  workflow_dispatch:

jobs:
  supply-diagnostics-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Supply, V15 route and economic regression tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs30|FullyQualifiedName~GaVs29|FullyQualifiedName~GaVs28|FullyQualifiedName~GaVs27|FullyQualifiedName~GaVs26|FullyQualifiedName~GaVs25|FullyQualifiedName~GaVs24|FullyQualifiedName~GaVs23|FullyQualifiedName~GaVs22|FullyQualifiedName~GaVs21|FullyQualifiedName~GaVs20|FullyQualifiedName~GaVs15'
      - name: Godot Release compile
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  supply-diagnostics-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate launcher and read-only diagnostic contracts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/launch-vs30.ps1').Path,
            [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | ForEach-Object Message | Out-String) }
          $main = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.cs'
          $lab = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
          $projection = Get-Content -Raw -Encoding UTF8 'GlobalArena.Simulation/PhysicalJourneySupplyProjection.cs'
          $e2e = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Tests/UiE2E.gd'
          if (-not $main.Contains('GA_VS30_RUNTIME_ACTIVE') -or
              -not $lab.Contains('GAQAAssessJourneyFood') -or
              -not $lab.Contains('GAQAJourneySupplyResult') -or
              -not $projection.Contains('FoodDemandRawPerWorker') -or
              -not $projection.Contains('PhysicalEconomicCadence.IsSettlementTurn') -or
              -not $e2e.Contains('GA_UI_E2E_SUPPLY_DIAGNOSIS_READ_ONLY_OK') -or
              -not $e2e.Contains('GA_UI_E2E_ACTIVE_SUPPLY_DIAGNOSIS_OK') -or
              -not $e2e.Contains('GA_UI_E2E_SUPPLY_DIAGNOSIS_V15_REOPEN_OK')) {
            throw 'VS30 canonical food and source opportunity diagnostic or E2E missing.'
          }
      - name: Supply, V15 route and economic regression tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs30|FullyQualifiedName~GaVs29|FullyQualifiedName~GaVs28|FullyQualifiedName~GaVs27|FullyQualifiedName~GaVs26|FullyQualifiedName~GaVs25|FullyQualifiedName~GaVs24|FullyQualifiedName~GaVs23|FullyQualifiedName~GaVs22|FullyQualifiedName~GaVs21|FullyQualifiedName~GaVs20|FullyQualifiedName~GaVs15'
      - name: Godot Debug compile
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Godot Release compile
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
