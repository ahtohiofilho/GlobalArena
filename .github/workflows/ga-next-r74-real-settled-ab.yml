name: GA-Next R74 — real settled maritime exactness gate

on:
  pull_request:
    paths:
      - 'GlobalArena.Tests/FoundationRealSettledMaritimeFreightBridgeTests.cs'
      - '.github/workflows/ga-next-r74-real-settled-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settled-maritime-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify R74, R73 and R70 integration regression
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationRealSettledMaritimeFreightBridgeTests|FullyQualifiedName~FoundationPhysicalFrozenEconomicMaritimeComparatorTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r74-evidence.log
      - name: Archive test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-next-r74-real-settled-ab
          path: ga-next-r74-evidence.log
          retention-days: 14
