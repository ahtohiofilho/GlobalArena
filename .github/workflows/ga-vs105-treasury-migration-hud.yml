name: GA-VS105 Godot Read-Only Treasury Migration HUD Gate

on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/**'
      - 'GlobalArena.Simulation/CanonicalDormantTreasuryMigrationPreflight.cs'
      - 'GlobalArena.Tests/GaVs104DormantTreasuryMigrationPreflightTests.cs'
      - '.github/workflows/ga-vs105-treasury-migration-hud.yml'
  workflow_dispatch:

concurrency:
  group: ga-vs105-treasury-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot-headless-vs105-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GA_UI_E2E_ISOLATED: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.ga-ui-e2e/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ga-ui-e2e/config
      XDG_CACHE_HOME: ${{ github.workspace }}/.ga-ui-e2e/cache
      GODOT_PROJECT: ${{ github.workspace }}/tools/GlobalArena.Godot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "GA_VS105_CHECKOUT_SHA=$EXPECTED_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: VS104 replay invariants
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs104DormantTreasuryMigrationPreflightTests|FullyQualifiedName~GaVs102IntegratedTreasurySaveTests"
      - name: Build actual Godot .NET project
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Download checksum-pinned Godot 4.7.2 Mono
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-dotnet" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          archive="$RUNNER_TEMP/godot-mono-4.7.2.zip"
          curl -fL --retry 4 --retry-delay 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-dotnet"
          godot="$(find "$RUNNER_TEMP/godot-dotnet" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          "$godot" --headless --version
      - name: Import resources in real Mono editor
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s "$GODOT_BIN" --headless --editor --path "$GODOT_PROJECT" --import --quit 2>&1 | tee "$RUNNER_TEMP/ga-vs105-import.log"
      - name: Real SceneTree V14 and V20 migration HUD witness
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path "$GODOT_PROJECT" --script res://Tests/UiE2E.gd 2>&1 | tee "$RUNNER_TEMP/ga-vs105-e2e.log"
          grep -q '^GA_UI_E2E_VS105_LEGACY_MIGRATION_READ_ONLY_OK$' "$RUNNER_TEMP/ga-vs105-e2e.log"
          grep -q '^GA_UI_E2E_VS105_V20_MIGRATION_READ_ONLY_OK$' "$RUNNER_TEMP/ga-vs105-e2e.log"
          grep -q '^GA_UI_E2E_PASS ' "$RUNNER_TEMP/ga-vs105-e2e.log"
          if grep -q 'GA_UI_E2E_FAIL\|SCRIPT ERROR\|Unhandled exception' "$RUNNER_TEMP/ga-vs105-e2e.log"; then
            echo "Runtime witness failed"
            exit 1
          fi
      - name: Preserve E2E evidence on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-vs105-godot-real-runtime
          path: ${{ runner.temp }}/ga-vs105-*.log
          if-no-files-found: ignore
          retention-days: 14

  godot-windows-compile:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: VS104 replay invariants
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs104DormantTreasuryMigrationPreflightTests|FullyQualifiedName~GaVs102IntegratedTreasurySaveTests"
      - name: Godot Debug build on Windows
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Godot Release build on Windows
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
