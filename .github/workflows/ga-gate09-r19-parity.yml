name: GA Gate09 R19 Experimental Binary Parity
on:
  pull_request:
    paths:
      - 'experiments/gate09/r19/**'
      - '.github/workflows/ga-gate09-r19-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r19-parity:
    name: R19 experimental / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate immutable source and references
        run: python -m unittest discover -s experiments/gate09/r19/tests -p 'test_*.py' -v
      - name: Verify R19 binary parity (23 + 270), benchmark Release
        run: python experiments/gate09/r19/ci/run_r19.py --output '${{ runner.temp }}' --benchmark
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r19-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R19-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
