name: GA Gate09 ADR044 NCP Contract and Bounded Toy Root

on:
  pull_request:
    paths:
      - 'experiments/gate09/adr044_ncp_contract/**'
      - 'docs/ga-gate09-adr044-ncp-kernel-decision-and-gates-draft.md'
      - '.github/workflows/ga-gate09-adr044-ncp-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncp-contract:
    name: ADR044 complementarity + tiny root / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original F072 economics and bounded complementarity contracts
        run: python -m unittest discover -s experiments/gate09/adr044_ncp_contract/tests -p 'test_*.py' -v
      - name: Verify five static cases and two toy-root recoveries
        run: python experiments/gate09/adr044_ncp_contract/ci/run_adr044.py --output '${{ runner.temp }}'
      - name: Upload complementarity and toy-root JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr044-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR044-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
