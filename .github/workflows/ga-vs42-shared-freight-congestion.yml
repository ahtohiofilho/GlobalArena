name: GA-VS42 Shared Commercial Corridor Saturation Lab

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/ExperimentalSharedFreightBatchCost.cs'
      - 'GlobalArena.Simulation/ExperimentalSharedFreightAllocationLaboratory.cs'
      - 'GlobalArena.Tests/GaVs42SharedFreightCorridorCongestionTests.cs'
      - 'GlobalArena.Benchmarks/GaVs42SharedCorridorBenchmarkHarness.cs'
      - 'GlobalArena.Benchmarks/Program.cs'
      - 'docs/engineering/GA-VS42-shared-freight-corridor-saturation-lab.md'
      - '.github/workflows/ga-vs42-shared-freight-congestion.yml'
  workflow_dispatch:

jobs:
  shared-freight-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shared corridor saturation, route optimality and exact pricing contracts
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter "FullyQualifiedName~GaVs42|FullyQualifiedName~GaVs41|FullyQualifiedName~GaVs40"
      - name: Synthetic multi-pole batch comparison benchmark
        run: dotnet run --project GlobalArena.Benchmarks/GlobalArena.Benchmarks.csproj -c Release -- --vs42-shared-freight
      - name: Godot Mono Release build
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  shared-freight-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Full freight, economy, saves and physical movement regression
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Godot Mono Debug build
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
