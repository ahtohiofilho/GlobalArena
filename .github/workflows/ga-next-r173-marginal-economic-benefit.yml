name: GA-Next R173 Marginal Economic Benefit Audit

on:
  pull_request:
    paths:
      - "GlobalArena.Tests/FoundationMarginalMarketComplexityAuditTests.cs"
      - ".github/workflows/ga-next-r173-marginal-economic-benefit.yml"
      - "docs/GA-NEXT-R173-MARGINAL-ECONOMIC-BENEFIT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: R173 first-pass vs stabilized market economic benefit / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Compare canonical gross and marginal pass benefit
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~FoundationMarginalMarketComplexityAuditTests" --logger "console;verbosity=detailed"
