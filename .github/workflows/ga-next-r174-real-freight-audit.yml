name: GA-Next R174 Real Freight Marginal Value Audit

on:
  pull_request:
    paths:
      - "GlobalArena.Tests/FoundationMarginalMarketComplexityAuditTests.cs"
      - ".github/workflows/ga-next-r174-real-freight-audit.yml"
      - "docs/GA-NEXT-R174-REAL-FREIGHT-AUDIT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: R174 net marginal economic benefit with real freight / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Audit actual edge freight and canonical net income
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~FoundationMarginalMarketComplexityAuditTests" --logger "console;verbosity=detailed"
