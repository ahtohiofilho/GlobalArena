name: G3-J3m Signed Versioned Backup Recovery

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/**'
      - 'GlobalArena.Tests/**'
      - '.github/workflows/ga-versioned-backup-recovery.yml'
  workflow_dispatch:

jobs:
  signed-versioned-recovery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tests
        run: dotnet restore GlobalArena.Tests/GlobalArena.Tests.csproj
      - name: Signed exact version, safe ZIP inventory, full replay and quarantine
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~J3m" --logger "console;verbosity=normal"
