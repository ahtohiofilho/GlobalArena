name: GA Gate09 ADR050 R13 Maximum Density Commercial Certification

on:
  pull_request:
    paths:
      - '.github/workflows/ga-gate09-adr050-maximum-density.yml'
      - 'docs/ga-gate09-adr050-maximum-r13-density-gate-draft.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maximum-r13-density:
    name: ADR050 2562 nodes 240 groups 120 markets / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout unchanged ADR049 and original F072 verifier
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original R13 and F072 contracts
        run: python -m unittest discover -s experiments/gate09/adr049_geography_density/tests -p 'test_*.py' -v
      - name: REQUIRE independently certified F072 240-group density
        run: python -u experiments/gate09/adr049_geography_density/ci/run_adr049.py --profile maximum_density --output '${{ runner.temp }}'
      - name: Upload original-economic GO or NO-GO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr050-maximum-density-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR049-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
