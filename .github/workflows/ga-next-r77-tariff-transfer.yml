name: GA-Next R77 — candidate toll transfer double-entry audit

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalCandidateTariffTransferReconciliation.cs'
      - 'GlobalArena.Tests/FoundationPhysicalCandidateTariffTransferReconciliationTests.cs'
      - '.github/workflows/ga-next-r77-tariff-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tariff-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify R77 and inherited economic freight gates
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationPhysicalCandidateTariffTransferReconciliationTests|FullyQualifiedName~FoundationPhysicalFrozenTariffAdmissionTests|FullyQualifiedName~FoundationPhysicalTariffBenefitReferenceTests|FullyQualifiedName~FoundationRealSettledMaritimeFreightBridgeTests|FullyQualifiedName~FoundationPhysicalFrozenEconomicMaritimeComparatorTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r77-results.log
      - name: Archive evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-next-r77-tariff-transfer
          path: ga-next-r77-results.log
          retention-days: 14
