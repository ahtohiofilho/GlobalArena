name: GA Gate09 R40 Final Entropic Solver and Architecture Decision

on:
  pull_request:
    paths:
      - 'experiments/gate09/r40/**'
      - 'docs/ga-gate09-r40-final-solver-family-architecture-gate-draft.md'
      - '.github/workflows/ga-gate09-r40-entropic-final-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-solver-gate:
    name: R40 last solver family + architecture decision / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify entropic supply and prices, fixed controls, three-family closing
        run: python -m unittest discover -s experiments/gate09/r40/tests -p 'test_*.py' -v
      - name: Compare final solver family under identical R14 oracle ceilings and decide
        run: python experiments/gate09/r40/ci/run_r40.py --profile ci --output '${{ runner.temp }}'
      - name: Archive third solver trials and binding architecture decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r40-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R40-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
