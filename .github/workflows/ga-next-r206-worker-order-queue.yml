name: GA-Next R206 Worker Order Queue

on:
  pull_request:
    paths:
      - 'GlobalArena.Runtime/FoundationWorkerOrderQueue.cs'
      - 'GlobalArena.Tests/FoundationWorkerOrderQueueTests.cs'
      - 'GlobalArena.Runtime/WorldState.cs'
      - '.github/workflows/ga-next-r206-worker-order-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-order-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Verify queue model and travel regression
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationWorkerOrderQueueTests|FullyQualifiedName~FoundationPersistedEdgeTravelTests' --logger 'console;verbosity=detailed'
