name: GA Foundation Physical Worker Economic Turn — CSharp Vertical Slice

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/**'
      - 'GlobalArena.Runtime/PhysicalWorkerRuntimeState.cs'
      - 'GlobalArena.Runtime/StrategicPhysicalWorkerInspector.cs'
      - 'GlobalArena.Runtime/WorldState.cs'
      - 'GlobalArena.Simulation/CanonicalWorldStateHasher.cs'
      - 'GlobalArena.Tests/FoundationPhysicalTradeCycleTests.cs'
      - 'GlobalArena.Tests/GoldbergFoundationSessionTests.cs'
      - 'GlobalArena.Tests/AuthoritativePhysicalWorkerJournalTests.cs'
      - 'GlobalArena.Tests/AuthoritativeTacticalWorkerV10Tests.cs'
      - 'GlobalArena.Tests/FoundationTacticalHumanAiV10Tests.cs'
      - 'GlobalArena.Tests/AuthoritativeWorkerOccupationsV11Tests.cs'
      - 'GlobalArena.Tests/FoundationConcentratedWorkforceTests.cs'
      - 'GlobalArena.Tests/FoundationTacticalOccupationOrdersTests.cs'
      - 'GlobalArena.Tests/FoundationTacticalOccupationBatchTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalWorkforceEconomicInputsTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalCommodityDemandTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalTradeEdgeLoadAuditTests.cs'
      - 'GlobalArena.Tests/FoundationLastClosedEconomicTradePublicationTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalDeliveryAllocationAuditTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalTradeRouteCandidatePlannerTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalMarginalMarketDistributorTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalGlobalMarginalCoordinatorTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalEndogenousCongestionFeedbackTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalLaggedFreightCycleTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalEconomicAccountingProposalTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalAuthoritativeTransportTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalNaturalTransportSeederTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalAltitudeCostSeparationTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalConstructionWorkProposalTests.cs'
      - 'GlobalArena.Runtime/PhysicalTransportInfrastructureRuntimeState.cs'
      - 'GlobalArena.Tests/FoundationPhysicalCongestionStabilityScaleTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalMultiPathFreightPlannerTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalCoupledMultiPathMarketFeedbackTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalMarginalPathRebalancerTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalSameCommodityConvergenceTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalGlobalConcaveFlowTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalJointMarketRoutePotentialTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalProgressiveMarketRouteTests.cs'
      - 'GlobalArena.Tests/FoundationPhysicalJointAdversarialMarketRouteTests.cs'
      - 'scripts/GA-Next-Joint-Stress-Report.ps1'
      - 'scripts/GA-Next-Joint-Stage-Profiling-Report.ps1'
      - 'scripts/GA-Next-Residual-Workspace-AB-Report.ps1'
      - 'scripts/GA-Next-Progressive-Cost-Report.ps1'
      - 'scripts/GA-Next-Route-Elision-AB-Report.ps1'
      - 'scripts/GA-Next-Identical-Market-AB-Report.ps1'
      - 'scripts/GA-Next-Global-Seed-Elision-AB-Report.ps1'
      - 'scripts/GA-Next-Global-Internal-Scaling-Report.ps1'
      - 'scripts/GA-Next-Indexed-Residual-Heap-AB-Report.ps1'
      - 'scripts/GA-Next-Shifted-Residual-Labels-AB-Report.ps1'
      - 'scripts/GA-Next-Residual-Dominance-AB-Report.ps1'
      - 'GlobalArena.Simulation/Foundation/FoundationConcentratedWorkforceScenario.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationWorkforceActivityGroups.cs'
      - 'GlobalArena.Tests/StrategicPhysicalWorkerInspectorTests.cs'
      - 'GlobalArena.Tests/FoundationLocalGameHostTests.cs'
      - 'GlobalArena.Tests/FoundationBatchedTurnTests.cs'
      - 'GlobalArena.Tests/FoundationCollectiveTurnCoordinatorTests.cs'
      - 'GlobalArena.Tests/FoundationHumanAiTurnHostTests.cs'
      - 'GlobalArena.Tests/FoundationHumanAiLocalPreviewTests.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.cs'
      - 'tools/GlobalArena.Godot/Launchers/**'
      - 'tools/GlobalArena.Godot/Scripts/GlobePreview.cs'
      - 'tools/GlobalArena.Godot/GlobalArena.Godot.csproj'
      - 'GlobalArena.Console/Program.cs'
      - 'docs/ga-foundation-first-playable-cycle.md'
      - 'docs/ga-foundation-goldberg-world-cycle.md'
      - 'docs/ga-foundation-authoritative-worker-journal.md'
      - 'docs/ga-foundation-godot-worker-inspection.md'
      - 'docs/ga-foundation-local-game-orders.md'
      - 'docs/ga-foundation-batched-turns.md'
      - 'docs/ga-foundation-collective-turns.md'
      - 'docs/ga-foundation-human-ai-turn-policy.md'
      - 'docs/ga-foundation-godot-human-ai-collective.md'
      - '.github/workflows/ga-foundation-physical-worker-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-slice:
    name: New foundation CSharp economic cycle + executable console / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore current real .NET 10 projects
        run: dotnet restore GlobalArena.Tests/GlobalArena.Tests.csproj
      - name: Compile all canonical simulation plus new foundation code
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-restore
      - name: Real CSharp physical worker market and movement contracts
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalTradeCycleTests|FullyQualifiedName~GoldbergFoundationSessionTests|FullyQualifiedName~AuthoritativePhysicalWorkerJournalTests|FullyQualifiedName~StrategicPhysicalWorkerInspectorTests|FullyQualifiedName~FoundationLocalGameHostTests|FullyQualifiedName~FoundationBatchedTurnTests|FullyQualifiedName~FoundationCollectiveTurnCoordinatorTests|FullyQualifiedName~FoundationHumanAiTurnHostTests|FullyQualifiedName~FoundationHumanAiLocalPreviewTests' --logger 'console;verbosity=normal'
      - name: Canonical fine G(18,0) worker v10 movement and replay tests
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~AuthoritativeTacticalWorkerV10Tests' --logger 'console;verbosity=normal'
      - name: Real tactical G(18,0) Human+AI all-ready collective gameplay
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationTacticalHumanAiV10Tests' --logger 'console;verbosity=normal'
      - name: Canonical v11 physical productive occupations with real human-AI replay
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~AuthoritativeWorkerOccupationsV11Tests' --logger 'console;verbosity=normal'
      - name: Individual occupation reassignment with canonical v11 journal replay
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationTacticalOccupationOrdersTests' --logger 'console;verbosity=normal'
      - name: Atomic productive worker batches — all-or-none and canonical v11 replay
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationTacticalOccupationBatchTests' --logger 'console;verbosity=normal'
      - name: Physical v11 workforce demand sites and active capacity — 10k worker validation
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalWorkforceEconomicInputsTests' --logger 'console;verbosity=normal'
      - name: Commodity-specific demand by explicit worker activity with no invented policy
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalCommodityDemandTests' --logger 'console;verbosity=normal'
      - name: Physical freight crossing audit — no invented routes or infrastructure ownership
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalTradeEdgeLoadAuditTests' --logger 'console;verbosity=normal'
      - name: Closed economic trade read boundary — no phantom cycles and per-civ privacy
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationLastClosedEconomicTradePublicationTests' --logger 'console;verbosity=normal'
      - name: Real v11 producer-to-buyer physical delivery reconciliation with exact freight conversion
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalDeliveryAllocationAuditTests' --logger 'console;verbosity=normal'
      - name: Physical economic route/buyer candidate selection — owner toll, path costs and 10k workers
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalTradeRouteCandidatePlannerTests' --logger 'console;verbosity=normal'
      - name: Physical marginal sqrt demand multi-buyer water-filling and exact split conservation
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalMarginalMarketDistributorTests' --logger 'console;verbosity=normal'
      - name: Coordinated physical marginal global producer rebalancing with exact conservation
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalGlobalMarginalCoordinatorTests' --logger 'console;verbosity=normal'
      - name: Physical economic accounting guard — universal prices, real demand, exact seller taxes and owner tolls
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalEconomicAccountingProposalTests' --logger 'console;verbosity=normal'
      - name: Authoritative v12 physical transport inventory — topology, hash, natural crossings and world-only freight
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalAuthoritativeTransportTests' --logger 'console;verbosity=normal'
      - name: Physical natural terrain-seeded freight — canonical land, coast, sea and no phantom road
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalNaturalTransportSeederTests' --logger 'console;verbosity=normal'
      - name: Edge altitude economic separation — quadratic construction and linear operation v13
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalAltitudeCostSeparationTests' --logger 'console;verbosity=normal'
      - name: Real worker construction precommit — exact per-edge labor, owner, eligibility and demand conservation
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalConstructionWorkProposalTests' --logger 'console;verbosity=normal'


      - name: Turn-locked freight pivot — fixed-cost water-filling and next-cycle lagged congestion
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalLaggedFreightCycleTests' --logger 'console;verbosity=normal'
      - name: Endogenous physical edge congestion — shared cargo scale and bounded cost-volume feedback
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalEndogenousCongestionFeedbackTests' --logger 'console;verbosity=normal'
      - name: Adaptive congestion stability and 512 physically distributed producer corridors
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalCongestionStabilityScaleTests' --logger 'console;verbosity=normal'
      - name: Multi-path physical freight candidate splits — real alternative routes, exact conserved loads and distributed sources
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalMultiPathFreightPlannerTests' --logger 'console;verbosity=normal'
      - name: Coupled physical buyers and audited multi-path freight congestion — connected world regression
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalCoupledMultiPathMarketFeedbackTests' --logger 'console;verbosity=normal'
      - name: Integrated marginal network-cost multi-path rerouting — owner tariffs and 104 connected real markets
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalMarginalPathRebalancerTests' --logger 'console;verbosity=normal'
      - name: Same-commodity global seller convergence on 112 connected physical tiles and 104 real markets
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalSameCommodityConvergenceTests' --logger 'console;verbosity=normal'
      - name: Global same-commodity concave flow — exact conserved supplies, 104 Goldberg markets and deterministic residual routes
        env:
          GA_RESIDUAL_WORKSPACE_REPORT_DIR: ${{ runner.temp }}/ga-next-residual-workspace
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalGlobalConcaveFlowTests' --logger 'console;verbosity=normal'
      - name: Report exact residual workspace A/B managed allocations and timings
        shell: pwsh
        env:
          GA_RESIDUAL_WORKSPACE_REPORT_DIR: ${{ runner.temp }}/ga-next-residual-workspace
        run: |
          & ./scripts/GA-Next-Residual-Workspace-AB-Report.ps1 -ReportDirectory $env:GA_RESIDUAL_WORKSPACE_REPORT_DIR
      - name: Exact A/B unused sequential market seed, 8 sellers and 104 worker markets
        env:
          GA_SEED_ELISION_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-global-seed-elision
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~UnusedSequentialSeedElisionMatchesFullReferenceOn104GoldbergMarkets|FullyQualifiedName~GlobalSeedPreflightAndReferenceRejectInvalidMarketsAndRoads' --logger 'console;verbosity=normal'
      - name: Validate and publish complete global-market seed-elision A/B evidence
        shell: pwsh
        env:
          GA_SEED_ELISION_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-global-seed-elision
        run: |
          & ./scripts/GA-Next-Global-Seed-Elision-AB-Report.ps1 -ReportDirectory $env:GA_SEED_ELISION_AB_REPORT_DIR
      - name: Archive complete global-market seed-elision A/B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-global-seed-elision-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-global-seed-elision/seed-elision-segments-*.json
          if-no-files-found: error
      - name: Profile internal residual flow, real buyers and goods at 112 208 320 416 Goldberg tiles
        env:
          GA_GLOBAL_FLOW_INTERNAL_REPORT_DIR: ${{ runner.temp }}/ga-next-global-flow-internals
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~InternalResidualAndPreparationCostsScaleAcrossFourGoldbergMarketSizes' --logger 'console;verbosity=normal'
      - name: Validate exact profiler A/B and publish four global residual stage profiles
        shell: pwsh
        env:
          GA_GLOBAL_FLOW_INTERNAL_REPORT_DIR: ${{ runner.temp }}/ga-next-global-flow-internals
        run: |
          & ./scripts/GA-Next-Global-Internal-Scaling-Report.ps1 -ReportDirectory $env:GA_GLOBAL_FLOW_INTERNAL_REPORT_DIR
      - name: Archive global residual 112 to 416 tile phase evidence
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-global-flow-internals-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-global-flow-internals/global-flow-internals-*.json
          if-no-files-found: error
      - name: Exact A/B indexed decrease-key versus legacy residual heap, 112 to 416 tiles
        env:
          GA_INDEXED_HEAP_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-indexed-residual-heap
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~IndexedResidualHeapPreservesExactFourScaleGoldbergGlobalMarkets|FullyQualifiedName~IndexedHeapMatchesOriginalResidualQueueOnReassignmentsTiesAndBudgets' --logger 'console;verbosity=normal'
      - name: Validate and publish four real-market indexed residual heap A/B reports
        shell: pwsh
        env:
          GA_INDEXED_HEAP_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-indexed-residual-heap
        run: |
          & ./scripts/GA-Next-Indexed-Residual-Heap-AB-Report.ps1 -ReportDirectory $env:GA_INDEXED_HEAP_AB_REPORT_DIR
      - name: Archive exact indexed residual heap A/B per system
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-indexed-residual-heap-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-indexed-residual-heap/indexed-heap-*.json
          if-no-files-found: error
      - name: Exact A/B shifted BigInteger residual labels vs reference, 112 to 416 Goldberg tiles
        env:
          GA_SHIFTED_LABELS_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-shifted-residual-labels
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~ShiftedLabelsMatchExactOriginalWithLargeBigIntegerCostsAndResidualTies|FullyQualifiedName~ShiftedExactResidualLabelsMatchOriginalOnFourRealGoldbergScales' --logger 'console;verbosity=normal'
      - name: Validate and publish four shifted-labels BigInteger A/B profiling reports
        shell: pwsh
        env:
          GA_SHIFTED_LABELS_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-shifted-residual-labels
        run: |
          & ./scripts/GA-Next-Shifted-Residual-Labels-AB-Report.ps1 -ReportDirectory $env:GA_SHIFTED_LABELS_AB_REPORT_DIR
      - name: Archive exact shifted-labels residual A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-shifted-residual-labels-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-shifted-residual-labels/shifted-labels-*.json
          if-no-files-found: error
      - name: Exact A/B nonnegative residual dominance vs reference across four Goldberg sizes and 240-bit costs
        env:
          GA_RESIDUAL_DOMINANCE_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-residual-dominance
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~ResidualDominanceMatchesShiftedReferenceOn240BitFreightAndAllHeapModes|FullyQualifiedName~ResidualNonnegativeDominanceMatchesExactReferenceOnFourGoldbergScales' --logger 'console;verbosity=normal'
      - name: Validate four exact residual dominance A/B reports
        shell: pwsh
        env:
          GA_RESIDUAL_DOMINANCE_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-residual-dominance
        run: |
          & ./scripts/GA-Next-Residual-Dominance-AB-Report.ps1 -ReportDirectory $env:GA_RESIDUAL_DOMINANCE_AB_REPORT_DIR
      - name: Archive full residual dominance A/B evidence on both systems
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-residual-dominance-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-residual-dominance/residual-dominance-*.json
          if-no-files-found: error
      - name: Progressive market route anytime proposals — exact bounded continuation and 104 real markets
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalProgressiveMarketRouteTests|FullyQualifiedName~ProgressiveOneProposalBudgetReplaysEightSellers104MarketsLikeFullJointSearch|FullyQualifiedName~ProgressiveRepriceOf104RealMarketsRetainsAuditedFreightAndRebasesOneProposal' --logger 'console;verbosity=normal'
      - name: Measure progressive market and freight proposal cost on 104 real markets
        env:
          GA_PROGRESSIVE_COST_REPORT_DIR: ${{ runner.temp }}/ga-next-progressive-cost
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~ProgressiveCostProfileSeparatesProposalsWarmRebasesAndColdSolves' --logger 'console;verbosity=normal'
      - name: Validate and publish progressive economics cost report (no timing SLA)
        shell: pwsh
        env:
          GA_PROGRESSIVE_COST_REPORT_DIR: ${{ runner.temp }}/ga-next-progressive-cost
        run: |
          & ./scripts/GA-Next-Progressive-Cost-Report.ps1 -ReportDirectory $env:GA_PROGRESSIVE_COST_REPORT_DIR
      - name: Preserve progressive cost measurements for audit
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-progressive-cost-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-progressive-cost/progressive-cost-104.json
          if-no-files-found: error
      - name: Exact A/B duplication-elision of route-only proposal on 104 worker markets
        env:
          GA_ROUTE_ELISION_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-route-elision-ab
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~DuplicateRouteElisionMatchesOriginalAcrossColdQuoteRoadAndGainFloor|FullyQualifiedName~DuplicateGoldbergRouteProposalMatchesReferenceAndAvoidsRecalculation' --logger 'console;verbosity=normal'
      - name: Validate and publish exact A/B route-only optimization profile
        shell: pwsh
        env:
          GA_ROUTE_ELISION_AB_REPORT_DIR: ${{ runner.temp }}/ga-next-route-elision-ab
        run: |
          & ./scripts/GA-Next-Route-Elision-AB-Report.ps1 -ReportDirectory $env:GA_ROUTE_ELISION_AB_REPORT_DIR
      - name: Preserve route-elision A/B audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-route-elision-ab-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-route-elision-ab/route-elision-104.json
          if-no-files-found: error
      - name: Exact A/B global market candidate early discard and 104 worker market fallback
        env:
          GA_IDENTICAL_MARKET_REPORT_DIR: ${{ runner.temp }}/ga-next-identical-market-ab
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~ExactSingleLocalMarketSkipsOnlyIdenticalGlobalRerouting|FullyQualifiedName~GlobalMarketEarlyDiscardPreservesFullA_BOnTwoMarketsAndRoadRebase|FullyQualifiedName~GlobalMarketIdenticalInputGuardKeepsGoldberg104A_BExact' --logger 'console;verbosity=normal'
      - name: Publish exact A/B global market early discard report
        shell: pwsh
        env:
          GA_IDENTICAL_MARKET_REPORT_DIR: ${{ runner.temp }}/ga-next-identical-market-ab
        run: |
          & ./scripts/GA-Next-Identical-Market-AB-Report.ps1 -ReportDirectory $env:GA_IDENTICAL_MARKET_REPORT_DIR
      - name: Archive global market early discard A/B
        uses: actions/upload-artifact@v4
        with:
          name: ga-next-identical-market-ab-${{ matrix.os }}
          path: ${{ runner.temp }}/ga-next-identical-market-ab/identical-market-104.json
          if-no-files-found: error
      - name: Joint global market and multipath integrated potential — monotone worker-backed search
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalJointMarketRoutePotentialTests' --logger 'console;verbosity=normal'
      - name: Joint global Goldberg stress — 8/104 baseline, severe load, and larger 16/192 markets
        env:
          GA_JOINT_STRESS_REPORT_DIR: ${{ runner.temp }}/ga-next-joint-stress
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalJointAdversarialMarketRouteTests' --logger 'console;verbosity=normal'
      - name: Publish certified joint stress outcomes and observed scaling
        shell: pwsh
        env:
          GA_JOINT_STRESS_REPORT_DIR: ${{ runner.temp }}/ga-next-joint-stress
        run: |
          & ./scripts/GA-Next-Joint-Stress-Report.ps1 -ReportDirectory $env:GA_JOINT_STRESS_REPORT_DIR
      - name: Joint global economic profiling — three Goldberg world sizes and isolated stages
        env:
          GA_JOINT_SCALE_REPORT_DIR: ${{ runner.temp }}/ga-next-joint-scale
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~IncreasingGoldbergMarketsSeparatesGlobalFlowMultipathAuditorAndJointCosts' --logger 'console;verbosity=normal'
      - name: Publish separate global flow, multipath, physical auditor and joint search costs
        shell: pwsh
        env:
          GA_JOINT_SCALE_REPORT_DIR: ${{ runner.temp }}/ga-next-joint-scale
        run: |
          & ./scripts/GA-Next-Joint-Stage-Profiling-Report.ps1 -ReportDirectory $env:GA_JOINT_SCALE_REPORT_DIR
      - name: Concentrated capital workforce with 3 6 and 12 people per civ
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationConcentratedWorkforceTests' --logger 'console;verbosity=normal'
      - name: Real executable three-turn gameplay kernel preview
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-slice
      - name: A/B same physical world cold start vs zero-time initial calibration
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-calibration-ab
      - name: Real Goldberg 92-node world with physical worker turn and market flow
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-goldberg
      - name: Authoritative worldstate worker movement, event journal and replay hash
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-worker-journal
      - name: Real local foundation scenario from initial workers through 3 replayed authoritative turns
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-local-game
      - name: Canonical multiple-worker batch closure and empty-turn replay
