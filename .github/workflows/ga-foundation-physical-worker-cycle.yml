name: GA Foundation Physical Worker Economic Turn — CSharp Vertical Slice

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/**'
      - 'GlobalArena.Runtime/PhysicalWorkerRuntimeState.cs'
      - 'GlobalArena.Runtime/StrategicPhysicalWorkerInspector.cs'
      - 'GlobalArena.Runtime/WorldState.cs'
      - 'GlobalArena.Simulation/CanonicalWorldStateHasher.cs'
      - 'GlobalArena.Tests/FoundationPhysicalTradeCycleTests.cs'
      - 'GlobalArena.Tests/GoldbergFoundationSessionTests.cs'
      - 'GlobalArena.Tests/AuthoritativePhysicalWorkerJournalTests.cs'
      - 'GlobalArena.Tests/StrategicPhysicalWorkerInspectorTests.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.cs'
      - 'tools/GlobalArena.Godot/Scripts/GlobePreview.cs'
      - 'tools/GlobalArena.Godot/GlobalArena.Godot.csproj'
      - 'GlobalArena.Console/Program.cs'
      - 'docs/ga-foundation-first-playable-cycle.md'
      - 'docs/ga-foundation-goldberg-world-cycle.md'
      - 'docs/ga-foundation-authoritative-worker-journal.md'
      - 'docs/ga-foundation-godot-worker-inspection.md'
      - '.github/workflows/ga-foundation-physical-worker-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-slice:
    name: New foundation CSharp economic cycle + executable console / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore current real .NET 10 projects
        run: dotnet restore GlobalArena.Tests/GlobalArena.Tests.csproj
      - name: Compile all canonical simulation plus new foundation code
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-restore
      - name: Real CSharp physical worker market and movement contracts
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationPhysicalTradeCycleTests|FullyQualifiedName~GoldbergFoundationSessionTests|FullyQualifiedName~AuthoritativePhysicalWorkerJournalTests|FullyQualifiedName~StrategicPhysicalWorkerInspectorTests' --logger 'console;verbosity=normal'
      - name: Real executable three-turn gameplay kernel preview
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-slice
      - name: A/B same physical world cold start vs zero-time initial calibration
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-calibration-ab
      - name: Real Goldberg 92-node world with physical worker turn and market flow
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-goldberg
      - name: Authoritative worldstate worker movement, event journal and replay hash
        run: dotnet run --project GlobalArena.Console/GlobalArena.Console.csproj -c Release -- --foundation-worker-journal
      - name: Compile the actual Godot .NET production client
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
      - name: Preserve historical CSharp runtime tests without modifying them
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --logger 'console;verbosity=minimal'
