name: GA Foundation Godot 4.7.2 .NET Runtime Scene Smoke

on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/**'
      - 'GlobalArena.Runtime/**'
      - 'GlobalArena.Simulation/Foundation/**'
      - 'docs/ga-foundation-godot-runtime-smoke.md'
      - '.github/workflows/ga-godot-foundation-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-runtime-smoke:
    name: Actual Godot Mono 4.7.2 scene + GUI events + journal replay / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GA_FOUNDATION_GODOT_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile the real Godot CSharp client with gameplay domain
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Obtain official Godot 4.7.2-stable .NET Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga-godot"
          curl -fSL --retry 4 --retry-delay 3 --connect-timeout 20 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o "$RUNNER_TEMP/ga-godot/runtime.zip"
          unzip -q "$RUNNER_TEMP/ga-godot/runtime.zip" -d "$RUNNER_TEMP/ga-godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/ga-godot/bin" -type f -name 'Godot_v4.7.2-stable_mono_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --version | tee "$RUNNER_TEMP/ga-godot/version.log"
          grep -q '4.7.2' "$RUNNER_TEMP/ga-godot/version.log"
      - name: Import real Godot project resources and Mono assemblies
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --editor --import --quit \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/import.log"
      - name: Run actual Main.tscn and Godot GUI callbacks under headless runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_FOUNDATION_SMOKE_PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_HUMAN_AI_E2E_PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_HUMAN_AI_E2E_STEP ready_and_commit=PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_RUNTIME_SMOKE_STEP batch_queued=PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_RUNTIME_SMOKE_STEP move=PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_RUNTIME_SMOKE_STEP production=PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          grep -q 'GA_GODOT_RUNTIME_SMOKE_STEP keyboard_g=PASS' "$RUNNER_TEMP/ga-godot/smoke.log"
          if grep -E 'GA_GODOT_FOUNDATION_SMOKE_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/smoke.log"; then
            echo "Actual Godot runtime has errors" >&2
            exit 1
          fi
      - name: Run separate tactical-first workspace Main.tscn smoke (M / TAB / ESC / E)
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_TACTICAL_ENTRY_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_TACTICAL_WORKSPACE_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_SHORTCUT_ROUTING_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_TACTICAL_GRID_SURFACE_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_LAYOUT_DOCK_E2E_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_OPERATIONS_DOCK_SCROLL_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_OPERATIONS_DOCK_COMPACT_SKIP_HEADLESS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_FLOATING_WINDOW_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          grep -q 'GA_NEXT_WORKFORCE_ROSTER_PASS' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"
          if grep -E 'GA_NEXT_TACTICAL_WORKSPACE_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/tactical-workspace.log"; then
            echo "Tactical workspace smoke encountered errors" >&2
            exit 1
          fi
      - name: Run Godot v10 canonical worker markers and fine Human+AI E2E headless
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 GA_NEXT_TACTICAL_V10_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/tactical-v10.log"
          grep -q 'GA_NEXT_TACTICAL_V10_E2E_PASS' "$RUNNER_TEMP/ga-godot/tactical-v10.log"
          grep -q 'GA_NEXT_WORKER_INSPECTOR_PASS version=10' "$RUNNER_TEMP/ga-godot/tactical-v10.log"
          grep -q 'GA_NEXT_WORKER_BADGE_VS16_PASS' "$RUNNER_TEMP/ga-godot/tactical-v10.log"
          grep -q 'GA_NEXT_FINE_HUMAN_AI_COMMIT turn=1' "$RUNNER_TEMP/ga-godot/tactical-v10.log"
          if grep -E 'GA_NEXT_TACTICAL_V10_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/tactical-v10.log"; then
            exit 1
          fi
      - name: Run Godot v11 authoritative three-occupation badge E2E headless
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 GA_NEXT_TACTICAL_V11_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/tactical-v11.log"
          grep -q 'GA_NEXT_TACTICAL_V11_E2E_PASS' "$RUNNER_TEMP/ga-godot/tactical-v11.log"
          grep -q 'GA_NEXT_WORKER_INSPECTOR_PASS version=11' "$RUNNER_TEMP/ga-godot/tactical-v11.log"
          grep -q 'GA_NEXT_V11_WORKER_OCCUPATIONS_PASS' "$RUNNER_TEMP/ga-godot/tactical-v11.log"
          grep -q 'GA_NEXT_FINE_HUMAN_AI_COMMIT turn=1' "$RUNNER_TEMP/ga-godot/tactical-v11.log"
          if grep -E 'GA_NEXT_TACTICAL_V11_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/tactical-v11.log"; then
            exit 1
          fi
      - name: Run six-per-civilization three-activity Godot E2E headless
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_CONCENTRATED_WORKFORCE_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          grep -q 'GA_NEXT_CONCENTRATED_WORKFORCE_E2E_PASS' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          grep -q 'GA_NEXT_OCCUPATION_TURN_E2E_PASS' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          grep -q 'GA_NEXT_UPRIGHT_BADGE_NUMBERS_PASS' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          grep -q 'GA_NEXT_CIVILIZATION_COLOR_PASS' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          grep -q 'GA_NEXT_WORKFORCE_AGGREGATION_HOVER_PASS' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          grep -q 'GA_NEXT_CONCENTRATED_WORKFORCE_COMMIT_PASS' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"
          if grep -E 'GA_NEXT_CONCENTRATED_WORKFORCE_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/concentrated-workforce.log"; then exit 1; fi
      - name: Regression — click-only inhabited tile → role → worker; mouse motion does nothing
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_TILE_CLICK_MENU_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/tile-click-menu.log"
          grep -q 'GA_NEXT_TILE_CLICK_HYPOTHESIS_E2E_PASS' "$RUNNER_TEMP/ga-godot/tile-click-menu.log"
          grep -q 'GA_NEXT_TILE_CLICK_HIERARCHY_INPUT_PASS' "$RUNNER_TEMP/ga-godot/tile-click-menu.log"
          if grep -E 'GA_NEXT_TILE_CLICK_HYPOTHESIS_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/tile-click-menu.log"; then exit 1; fi
      - name: 'Native worker board — three role slots, drag callback, pending, X and E headless'
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_WORKER_BOARD_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/worker-board.log"
          grep -q 'GA_NEXT_WORKER_BOARD_SLOTS_PASS' "$RUNNER_TEMP/ga-godot/worker-board.log"
          grep -q 'GA_NEXT_WORKER_BOARD_PENDING_PASS' "$RUNNER_TEMP/ga-godot/worker-board.log"
          grep -q 'GA_NEXT_WORKER_BOARD_COMMIT_PASS' "$RUNNER_TEMP/ga-godot/worker-board.log"
          grep -q 'GA_NEXT_WORKER_BOARD_E2E_PASS' "$RUNNER_TEMP/ga-godot/worker-board.log"
          if grep -E 'GA_NEXT_WORKER_BOARD_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/worker-board.log"; then exit 1; fi
      - name: QA-only v15 monetary closing in actual Godot scene (headless E keys)
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_SETTLED_TRADE_VISUAL_SMOKE=1 \
            timeout 180s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/settled-trade-headless.log"
          grep -q 'GA_NEXT_V15_GODOT_SETTLED_TRADE_PASS' "$RUNNER_TEMP/ga-godot/settled-trade-headless.log"
          grep -q 'GA_NEXT_V15_SETTLED_TRADE_READY cycle=1' "$RUNNER_TEMP/ga-godot/settled-trade-headless.log"
          grep -q 'GA_NEXT_V15_SETTLED_TRADE_READY cycle=2' "$RUNNER_TEMP/ga-godot/settled-trade-headless.log"
          if grep -E 'GA_NEXT_V15_GODOT_SETTLED_TRADE_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/settled-trade-headless.log"; then exit 1; fi
      - name: Interactive economy evaluation — real v13 scene, no auto turns, no closing smoke
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_SETTLED_TRADE_VISUAL_SMOKE=0 \
            GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 120 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/interactive-economy-preview.log"
          grep -q 'GA_NEXT_INTERACTIVE_ECONOMY_PREVIEW_READY' "$RUNNER_TEMP/ga-godot/interactive-economy-preview.log"
          grep -q 'configuration=qa_only_not_approved opening_cash=zero' "$RUNNER_TEMP/ga-godot/interactive-economy-preview.log"
          if grep -E 'GA_NEXT_V15_SETTLED_TRADE_READY|GA_NEXT_V15_GODOT_SETTLED_TRADE_PASS|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/interactive-economy-preview.log"; then
            echo 'Preview must not auto-commit a trade turn or launch the CI autoplay smoke.'
            exit 1
          fi
      - name: R87 signed G18 headless visual-authority and actual economic turn acceptance
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_FINE_FIRST_VISUAL_SMOKE=1 \
            timeout 180s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R87_G18_TERRAIN_FREIGHT_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R88_G18_CONTINUOUS_ICE_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R89_MARITIME_HIERARCHY_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R90_POLAR_FRAMES_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R91_SURFACE_CONTRACT_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R94_FROZEN_FREIGHT_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          grep -q 'GA_NEXT_R87_G18_GODOT_ACCEPTANCE_PASS' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"
          if grep -E 'GA_NEXT_R87_G18_GODOT_ACCEPTANCE_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/r87-g18-headless.log"; then exit 1; fi
      - name: R87 G18 interactive evaluation has no autoplay and stays open
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_FINE_FIRST_INTERACTIVE_PREVIEW=1 \
            timeout 180s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 120 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/r87-g18-interactive.log"
          grep -q 'GA_NEXT_R87_FINE_FIRST_INTERACTIVE_READY' "$RUNNER_TEMP/ga-godot/r87-g18-interactive.log"
          grep -q 'GA_NEXT_R87_G18_TERRAIN_BOUND source=signed_g18' "$RUNNER_TEMP/ga-godot/r87-g18-interactive.log"
          if grep -E 'GA_NEXT_R87_G18_GODOT_ACCEPTANCE_PASS|GA_NEXT_R87_G18_GODOT_ACCEPTANCE_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/r87-g18-interactive.log"; then exit 1; fi
      - name: R45 continuous tactical navigation (two focus handoffs in one held drag)
        shell: bash
        run: |
          set -euo pipefail
          GA_FOUNDATION_GODOT_SMOKE=0 GA_NEXT_WORKSPACE_SMOKE=0 \
            GA_NEXT_CONTINUOUS_NAVIGATION_SMOKE=1 \
            timeout 120s "$GODOT_BIN" --headless --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/continuous-nav.log"
          grep -q 'GA_NEXT_CONTINUOUS_NAVIGATION_INPUT_PASS' "$RUNNER_TEMP/ga-godot/continuous-nav.log"
          grep -q 'GA_NEXT_R98_EXACT_SPHERE_FOCUS_PASS' "$RUNNER_TEMP/ga-godot/continuous-nav.log"
          grep -q 'GA_NEXT_CONTINUOUS_NAVIGATION_PASS' "$RUNNER_TEMP/ga-godot/continuous-nav.log"
          if grep -E 'GA_NEXT_CONTINUOUS_NAVIGATION_FAIL|SCRIPT ERROR|Unhandled Exception' "$RUNNER_TEMP/ga-godot/continuous-nav.log"; then exit 1; fi
      - name: Install virtual display and software OpenGL for a real rendered frame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1
      - name: Re-run actual Godot window with Xvfb and capture render evidence
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GA_FOUNDATION_GODOT_SCREENSHOT_DIR: ${{ runner.temp }}/ga-godot/screenshots
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 120s "$GODOT_BIN" --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_FOUNDATION_SMOKE_PASS' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_HUMAN_AI_E2E_PASS' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_HUMAN_AI_E2E_STEP ready_and_commit=PASS' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_RENDER_FRAME_PASS stage=01_startup' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_RENDER_FRAME_PASS stage=02_queued' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_RENDER_FRAME_PASS stage=03_after_batch_move' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          grep -q 'GA_GODOT_RENDER_FRAME_PASS stage=04_after_shortcut' "$RUNNER_TEMP/ga-godot/graphical-smoke.log"
          test -s "$GA_FOUNDATION_GODOT_SCREENSHOT_DIR/01_startup.png"
          test -s "$GA_FOUNDATION_GODOT_SCREENSHOT_DIR/02_queued.png"
          test -s "$GA_FOUNDATION_GODOT_SCREENSHOT_DIR/03_after_batch_move.png"
          test -s "$GA_FOUNDATION_GODOT_SCREENSHOT_DIR/04_after_shortcut.png"
      - name: Render actual tactical startup, planet and operations windows under Xvfb
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GA_FOUNDATION_GODOT_SMOKE: '0'
          GA_NEXT_WORKSPACE_SMOKE: '1'
          GA_NEXT_WORKSPACE_SCREENSHOT_DIR: ${{ runner.temp }}/ga-godot/workspace
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 120s "$GODOT_BIN" --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_TACTICAL_WORKSPACE_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_SHORTCUT_ROUTING_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_TACTICAL_GRID_SURFACE_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_LAYOUT_DOCK_E2E_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_OPERATIONS_DOCK_SCROLL_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_OPERATIONS_DOCK_COMPACT_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_FLOATING_WINDOW_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          grep -q 'GA_NEXT_WORKFORCE_ROSTER_PASS' "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
          for stage in 01_tactical_start 02_planet_map 03_operations_panel 03_operations_bottom 03_operations_compact 04_after_ai_turn; do
            grep -q "GA_NEXT_RENDER_FRAME_PASS stage=$stage" "$RUNNER_TEMP/ga-godot/workspace-graphical.log"
            test -s "$GA_NEXT_WORKSPACE_SCREENSHOT_DIR/$stage.png"
          done
      - name: Render real v10 worker markers, orders and collective turn under Xvfb
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GA_FOUNDATION_GODOT_SMOKE: '0'
          GA_NEXT_WORKSPACE_SMOKE: '0'
          GA_NEXT_TACTICAL_V10_SMOKE: '1'
          GA_NEXT_TACTICAL_V10_SCREENSHOT_DIR: ${{ runner.temp }}/ga-godot/tactical-v10
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 120s "$GODOT_BIN" --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/tactical-v10-graphical.log"
          grep -q 'GA_NEXT_TACTICAL_V10_E2E_PASS' "$RUNNER_TEMP/ga-godot/tactical-v10-graphical.log"
          grep -q 'GA_NEXT_WORKER_INSPECTOR_PASS version=10' "$RUNNER_TEMP/ga-godot/tactical-v10-graphical.log"
          grep -q 'GA_NEXT_WORKER_BADGE_VS16_PASS' "$RUNNER_TEMP/ga-godot/tactical-v10-graphical.log"
          for stage in 00_hover_worker 01_worker_roster 02_order_queued 03_after_collective_turn 04_after_production; do
            grep -q "GA_NEXT_V10_RENDER_FRAME_PASS stage=$stage" "$RUNNER_TEMP/ga-godot/tactical-v10-graphical.log"
            test -s "$GA_NEXT_TACTICAL_V10_SCREENSHOT_DIR/$stage.png"
          done
      - name: Render actual v11 agricultural forest and mining workforce under Xvfb
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GA_FOUNDATION_GODOT_SMOKE: '0'
          GA_NEXT_WORKSPACE_SMOKE: '0'
          GA_NEXT_TACTICAL_V11_SMOKE: '1'
          GA_NEXT_TACTICAL_V11_SCREENSHOT_DIR: ${{ runner.temp }}/ga-godot/tactical-v11
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 120s "$GODOT_BIN" --path tools/GlobalArena.Godot --quit-after 900 \
            2>&1 | tee "$RUNNER_TEMP/ga-godot/tactical-v11-graphical.log"
          grep -q 'GA_NEXT_TACTICAL_V11_E2E_PASS' "$RUNNER_TEMP/ga-godot/tactical-v11-graphical.log"
          grep -q 'GA_NEXT_WORKER_INSPECTOR_PASS version=11' "$RUNNER_TEMP/ga-godot/tactical-v11-graphical.log"
