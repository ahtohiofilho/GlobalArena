name: GA-Next R210 Persistent Worker Time
on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPersistentWorkerTurnScheduler.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationConstructionApproachRouter.cs'
      - 'GlobalArena.Runtime/WorldState.cs'
      - 'GlobalArena.Tests/FoundationTemporalEconomicJournalGateTests.cs'
      - '.github/workflows/ga-next-r210-persistent-worker-time.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistent-worker-time:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~FoundationTemporalEconomicJournalGateTests|FullyQualifiedName~FoundationPersistentOrderJournalTests|FullyQualifiedName~FoundationPersistedEdgeTravelTests|FullyQualifiedName~FoundationWorkerOrderQueueTests' --logger 'console;verbosity=detailed'
