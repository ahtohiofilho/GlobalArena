name: G3-J3l Signed Fencing And Immutable Backup Verification

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/**'
      - 'GlobalArena.Tests/**'
      - '.github/workflows/ga-signed-operational-evidence.yml'
  workflow_dispatch:

jobs:
  signed-operational-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tests
        run: dotnet restore GlobalArena.Tests/GlobalArena.Tests.csproj
      - name: ECDSA attestation, anti-replay, backup SHA and recovery policy
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~G3J3lSignedOperationalEvidenceTests|FullyQualifiedName~J3lBackupGate" --logger "console;verbosity=normal"
