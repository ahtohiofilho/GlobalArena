name: GA-Next R82 — tactical-first canonical geography foundation

on:
  pull_request:
    paths:
      - 'GlobalArena.World/FoundationFineFirstPhysicalGeography.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalNaturalTransportSeeder.cs'
      - 'GlobalArena.Tests/FoundationFineFirstPhysicalGeographyTests.cs'
      - '.github/workflows/ga-next-r82-fine-first-geography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fine-first-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run R82 independent geography and inherited natural freight tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationFineFirstPhysicalGeographyTests|FullyQualifiedName~FoundationPhysicalNaturalTransportSeederTests|FullyQualifiedName~FoundationSettledOwnerTollEndToEndTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r82-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-next-r82-fine-first-geography
          path: ga-next-r82-results.log
          retention-days: 14
