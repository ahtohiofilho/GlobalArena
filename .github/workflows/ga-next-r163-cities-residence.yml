name: GA-Next R163 Canonical Cities And Residence

on:
  pull_request:
    paths:
      - 'GlobalArena.Runtime/FoundationCityResidenceRuntimeState.cs'
      - 'GlobalArena.Runtime/WorldState.cs'
      - 'GlobalArena.Simulation/CanonicalWorldStateHasher.cs'
      - 'GlobalArena.Simulation/Foundation/FoundationDemographicGrowthPlanner.cs'
      - 'GlobalArena.Tests/FoundationCityResidenceRuntimeTests.cs'
      - '.github/workflows/ga-next-r163-cities-residence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residence-ledger:
    name: R163 city identity residence and v16 hash / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build canonical CSharp foundation
        run: dotnet build GlobalArena.Tests/GlobalArena.Tests.csproj -c Release
      - name: Validate residence independence and original demographic regressions
        run: |
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~FoundationCityResidenceRuntimeTests|FullyQualifiedName~FoundationDemographicGrowthPlannerTests' --logger 'console;verbosity=detailed'
      - name: Summarize R163 behavior
        run: |
          echo '### R163 — canonical cities and residence v16' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests ensure physical travel does not relocate HOME residence, all workers retain exactly one residence, v16 hashing is deterministic, and historical demographics remain stable.' >> "$GITHUB_STEP_SUMMARY"
