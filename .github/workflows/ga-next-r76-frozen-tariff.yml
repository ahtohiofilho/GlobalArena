name: GA-Next R76 — frozen tariff admission no-double-charge gate

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/Foundation/FoundationPhysicalFrozenTariffAdmission.cs'
      - 'GlobalArena.Tests/FoundationPhysicalFrozenTariffAdmissionTests.cs'
      - '.github/workflows/ga-next-r76-frozen-tariff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-tariff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify R76, R75 and R74 research gates
        shell: bash
        run: |
          set -o pipefail
          dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~FoundationPhysicalFrozenTariffAdmissionTests|FullyQualifiedName~FoundationPhysicalTariffBenefitReferenceTests|FullyQualifiedName~FoundationRealSettledMaritimeFreightBridgeTests|FullyQualifiedName~FoundationPhysicalFrozenEconomicMaritimeComparatorTests' \
            --logger 'console;verbosity=detailed' --nologo 2>&1 | tee ga-next-r76-results.log
      - name: Archive evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-next-r76-frozen-tariff
          path: ga-next-r76-results.log
          retention-days: 14
