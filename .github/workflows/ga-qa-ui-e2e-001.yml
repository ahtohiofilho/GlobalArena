name: GA-QA-UI-E2E-001 Real Godot .NET Runtime

on:
  pull_request:
    paths:
      - 'tools/GlobalArena.Godot/**'
      - '.github/workflows/ga-qa-ui-e2e-001.yml'
  workflow_dispatch:

jobs:
  godot-headless-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GA_UI_E2E_ISOLATED: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.ga-ui-e2e/data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ga-ui-e2e/config
      XDG_CACHE_HOME: ${{ github.workspace }}/.ga-ui-e2e/cache
      GODOT_PROJECT: ${{ github.workspace }}/tools/GlobalArena.Godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download the real Godot 4.7.2 Mono Linux binary (SHA-256 pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-dotnet" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          archive="$RUNNER_TEMP/godot-mono-4.7.2.zip"
          curl -fL --retry 4 --retry-delay 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-dotnet"
          godot="$(find "$RUNNER_TEMP/godot-dotnet" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          "$godot" --headless --version
      - name: Build the actual Godot C# client, not only domain projects
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Import Godot project resources in its real .NET editor
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s "$GODOT_BIN" --headless --editor --path "$GODOT_PROJECT" --import --quit 2>&1 | tee "$RUNNER_TEMP/ga-ui-e2e-import.log"
      - name: Real SceneTree signal-to-HUD and save/reopen E2E
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path "$GODOT_PROJECT" --script res://Tests/UiE2E.gd 2>&1 | tee "$RUNNER_TEMP/ga-ui-e2e-runtime.log"
          grep -q '^GA_UI_E2E_PASS ' "$RUNNER_TEMP/ga-ui-e2e-runtime.log"
          if grep -q 'GA_UI_E2E_FAIL\|SCRIPT ERROR\|Unhandled exception' "$RUNNER_TEMP/ga-ui-e2e-runtime.log"; then
            echo "E2E runtime emitted a failure despite an exit code of zero."
            exit 1
          fi
      - name: Preserve Godot runtime and import logs on any failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-ui-e2e-001-godot-logs
          path: ${{ runner.temp }}/ga-ui-e2e-*.log
          if-no-files-found: ignore
          retention-days: 14
