name: GA-VS23 Five-Cycle Offline Economic Outcomes

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/PhysicalEconomicCycleProgression.cs'
      - 'GlobalArena.Tests/GaVs23MulticycleEconomicOutcomesTests.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
      - 'tools/GlobalArena.Godot/Scripts/Main.cs'
      - 'tools/launch-vs23.ps1'
      - '.github/workflows/ga-vs23-multicycle-economic-outcomes.yml'
      - '.github/workflows/ga-vs22-economic-cycle-visibility.yml'
      - '.github/workflows/ga-vs21-local-worker-reallocation.yml'
      - '.github/workflows/ga-vs20-emergent-settlements.yml'
      - '.github/workflows/ga-vs19b-born-civilization.yml'
      - '.github/workflows/ga-vs19c-operational-hud.yml'
  workflow_dispatch:

jobs:
  five-cycle-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Five-cycle replay, temporal travel, and prior economic regression
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs23|FullyQualifiedName~GaVs22|FullyQualifiedName~GaVs21|FullyQualifiedName~GaVs20|FullyQualifiedName~GaVs11'
      - name: Build Godot Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release

  five-cycle-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify VS23 launcher and stable HUD/physical-cycle contract
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/launch-vs23.ps1').Path,
            [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | ForEach-Object Message | Out-String) }
          $runner = Get-Content -Raw -Encoding UTF8 'tools/launch-vs23.ps1'
          $main = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.cs'
          $lab = Get-Content -Raw -Encoding UTF8 'tools/GlobalArena.Godot/Scripts/Main.NeolithicWorkerLab.cs'
          $progression = Get-Content -Raw -Encoding UTF8 'GlobalArena.Simulation/PhysicalEconomicCycleProgression.cs'
          if (-not $runner.Contains('feature/ga-vs23-multicycle-economic-outcomes-20261031') -or
              -not $runner.Contains('-c Debug') -or
              -not $runner.Contains('& $GodotExe --path $projectDir --verbose') -or
              (-not $main.Contains('GA_VS23_RUNTIME_ACTIVE') -and
               -not $main.Contains('GA_VS24_RUNTIME_ACTIVE') -and
               (-not $main.Contains('GA_VS25_RUNTIME_ACTIVE') -and (-not $main.Contains('GA_VS26_RUNTIME_ACTIVE') -and (-not $main.Contains('GA_VS27_RUNTIME_ACTIVE') -and -not $main.Contains('GA_VS28_RUNTIME_ACTIVE'))))) -or
              -not $lab.Contains('AdvanceOfflineLabFiveEconomicCycles') -or
              -not $lab.Contains('PhysicalEconomicCycleProgression.SummarizeRecent') -or
              -not $progression.Contains('public static PhysicalEconomicBatchPlan AdvanceBatch') -or
              -not $progression.Contains('AdvanceToNext(session)')) {
            throw 'VS23 five-cycle action, deterministic replay or Windows launcher contract missing.'
          }
      - name: Five-cycle replay, temporal travel, and prior economic regression
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --filter 'FullyQualifiedName~GaVs23|FullyQualifiedName~GaVs22|FullyQualifiedName~GaVs21|FullyQualifiedName~GaVs20|FullyQualifiedName~GaVs11'
      - name: Build Godot Debug
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Debug
      - name: Build Godot Release
        run: dotnet build tools/GlobalArena.Godot/GlobalArena.Godot.csproj -c Release
