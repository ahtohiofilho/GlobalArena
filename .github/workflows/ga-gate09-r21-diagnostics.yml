name: GA Gate09 R21 Convergence Diagnostics

on:
  pull_request:
    paths:
      - 'experiments/gate09/r21/**'
      - '.github/workflows/ga-gate09-r21-diagnostics.yml'
      - 'docs/ga-gate09-r21-diagnostics-draft.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: R21 diagnostics / \${{ matrix.os }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upstream integrity and diagnostic contracts
        run: python -m unittest discover -s experiments/gate09/r21/tests -p 'test_*.py' -v
      - name: Generate R21 gap, load, price and audit trajectories
        run: python experiments/gate09/r21/ci/run_r21.py --profile ci --output '\${{ runner.temp }}'
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r21-\${{ matrix.os }}
          path: \${{ runner.temp }}/GA-Gate09-R21-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
