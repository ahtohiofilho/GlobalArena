name: GA Gate09 R23 Controlled Stabilization

on:
  pull_request:
    paths:
      - 'experiments/gate09/r23/**'
      - '.github/workflows/ga-gate09-r23-targeted.yml'
      - 'docs/ga-gate09-r23-controlled-stabilization-draft.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-damping:
    name: R23 controlled damping / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic contracts and upstream parity
        run: python -m unittest discover -s experiments/gate09/r23/tests -p 'test_*.py' -v
      - name: Compare five equal-update stabilization policies
        run: python experiments/gate09/r23/ci/run_r23.py --profile ci --output '${{ runner.temp }}'
      - name: Archive diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-r23-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-R23-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
