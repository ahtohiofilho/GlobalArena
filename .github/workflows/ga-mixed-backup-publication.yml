name: G3-J3n Mixed Replay And Publication Fencing

on:
  pull_request:
    paths:
      - 'GlobalArena.Simulation/**'
      - 'GlobalArena.Tests/**'
      - '.github/workflows/ga-mixed-backup-publication.yml'
  workflow_dispatch:

jobs:
  mixed-recovery-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GlobalArena.Tests/GlobalArena.Tests.csproj
      - name: Mixed journal/HMAC, publication interruptions, racing writers
        run: dotnet test GlobalArena.Tests/GlobalArena.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~J3n" --logger "console;verbosity=normal"
