name: GA Gate09 ADR045 General Multigroup MCP Solver

on:
  pull_request:
    paths:
      - 'experiments/gate09/adr045_general_mcp/**'
      - 'docs/ga-gate09-adr045-general-mcp-vi-solver-draft.md'
      - '.github/workflows/ga-gate09-adr045-general-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-contract:
    name: ADR045 multigroup MCP and global route separation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test analytic derivatives, physical conservation, global routes and F072 safety
        run: python -m unittest discover -s experiments/gate09/adr045_general_mcp/tests -p 'test_*.py' -v
      - name: Execute multigroup MCP 42-node and exploratory 162-node under fixed budgets
        run: python experiments/gate09/adr045_general_mcp/ci/run_adr045.py --profile extended --output '${{ runner.temp }}'
      - name: Archive all PASS and NO-GO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-gate09-adr045-${{ matrix.os }}
          path: ${{ runner.temp }}/GA-Gate09-ADR045-Evidencias-*.zip
          if-no-files-found: warn
          retention-days: 14
